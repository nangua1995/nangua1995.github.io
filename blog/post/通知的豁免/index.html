<script type="application/json" id="sourceZh">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/03/27/%e9%80%9a%e7%9f%a5%e7%9a%84%e8%b1%81%e5%85%8d/)\n\n<p>参考android developer 链接：<\/p>\n\n\n\n<p><a href=\"https://developer.android.google.cn/develop/ui/views/notifications/notification-permission?authuser=0&amp;hl=zh-cn#exemptions\">https://developer.android.google.cn/develop/ui/views/notifications/notification-permission?authuser=0&amp;hl=zh-cn#exemptions<\/a><\/p>\n\n\n\n<p>此部分列出了一些不受通知权限行为变更影响的通知和应用。在 Android 13（API 级别 33）或更高版本中，如果用户拒绝授予通知权限，他们仍会在任务管理器中看到与前台服务相关的通知，但在抽屉式通知栏中看不到这些通知。<br>媒体会话<br>与媒体会话有关的通知不受此行为变更的影响。<br>配置为自行管理通话的应用<br>如果您将应用配置为自行管理通话，那么您无需 POST_NOTIFICATIONS 权限即可让应用发送使用 Notification.CallStyle 通知样式的通知。<br>如果您的应用执行以下每项操作，系统就会认为您的应用已将自己配置为自行管理通话：<br>1. 声明 MANAGE_OWN_CALLS 权限。<br>2. 实现 ConnectionService 接口。<br>3. 通过调用 registerPhoneAccount() 向设备的电信服务提供商注册。<\/p>\n"</script>
<script type="application/json" id="sourceEn">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/03/27/%e9%80%9a%e7%9f%a5%e7%9a%84%e8%b1%81%e5%85%8d/)\n\n<p>参考android developer 链接：<\/p>\n\n\n\n<p><a href=\"https://developer.android.google.cn/develop/ui/views/notifications/notification-permission?authuser=0&amp;hl=zh-cn#exemptions\">https://developer.android.google.cn/develop/ui/views/notifications/notification-permission?authuser=0&amp;hl=zh-cn#exemptions<\/a><\/p>\n\n\n\n<p>此部分列出了一些不受通知权限行为变更影响的通知和应用。在 Android 13（API 级别 33）或更高版本中，如果用户拒绝授予通知权限，他们仍会在任务管理器中看到与前台服务相关的通知，但在抽屉式通知栏中看不到这些通知。<br>媒体会话<br>与媒体会话有关的通知不受此行为变更的影响。<br>配置为自行管理通话的应用<br>如果您将应用配置为自行管理通话，那么您无需 POST_NOTIFICATIONS 权限即可让应用发送使用 Notification.CallStyle 通知样式的通知。<br>如果您的应用执行以下每项操作，系统就会认为您的应用已将自己配置为自行管理通话：<br>1. 声明 MANAGE_OWN_CALLS 权限。<br>2. 实现 ConnectionService 接口。<br>3. 通过调用 registerPhoneAccount() 向设备的电信服务提供商注册。<\/p>\n"</script>

<script>
(function(){
  function apply(lang){
    document.documentElement.lang=lang==="en"?"en":"zh-CN";

    document.title=document.body.dataset["title"+(lang==="en"?"En":"Zh")]+" · snowCrane";
    document.getElementById("langToggle").textContent=lang==="en"?"中文":"EN";
    if(window.setArticleLanguage) window.setArticleLanguage(lang);
    localStorage.setItem("snowcrane-lang",lang);
  }
  document.getElementById("langToggle").onclick=function(){
    apply(document.documentElement.lang==="en"?"zh":"en");
  };
  apply(localStorage.getItem("snowcrane-lang")==="en"?"en":"zh");
})();
</script>
