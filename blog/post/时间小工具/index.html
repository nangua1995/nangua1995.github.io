     }\n        .toast.show {\n            opacity: 1;\n            transform: translateX(-50%) translateY(0);\n        }\n        @media (max-width: 768px) {\n            .toast {\n                top: 10px;\n                left: 10px;\n                right: 10px;\n                transform: translateY(-20px);\n                text-align: center;\n            }\n            .toast.show {\n                transform: translateY(0);\n            }\n        }\n    <\/style>\n<\/head>\n<body>\n    <div class=\"container\">\n        <h1>时间戳转换工具<\/h1>\n        \n        <div class=\"current-timestamp\">\n            当前时间戳: <span id=\"currentTimestamp\">1777040332<\/span> \n            <button class=\"copy-btn\" onclick=\"copyToClipboard('currentTimestamp')\">点击复制<\/button>\n            <button class=\"stop-btn\" onclick=\"toggleTimestampUpdate()\" id=\"stopBtn\">停止<\/button>\n        <\/div>\n        \n        <div class=\"converter-section\">\n            <div class=\"converter-row\" style=\"justify-content: space-between;\">\n                <label style=\"flex: 0 0 80px;\">时间戳<\/label>\n                <input type=\"text\" id=\"timestampInput\" placeholder=\"例如：1777040332\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertTimestampToBeijingTime()\" style=\"flex: 0 0 100px;\">转换 >><\/button>\n                <div class=\"result\" id=\"beijingTimeResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('beijingTimeResult')\" style=\"flex: 0 0 120px;\">北京时间 (点击复制)<\/button>\n            <\/div>\n            \n            <div class=\"converter-row\" style=\"justify-content: space-between; margin-top: 15px;\">\n                <label style=\"flex: 0 0 80px;\">北京时间<\/label>\n                <input type=\"datetime-local\" id=\"beijingTimeInput\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertBeijingTimeToTimestamp()\" style=\"flex: 0 0 100px;\">转换 >><\/button>\n                <div class=\"result\" id=\"timestampResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <div style=\"display: flex; gap: 10px;\">\n                    <button class=\"copy-result-btn\" onclick=\"copyToClipboard('timestampResult')\">时间戳 (点击复制)<\/button>\n                    <button class=\"copy-result-btn\" onclick=\"copyMilliseconds()\">复制毫秒<\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n        \n        <!-- 时间差计算功能 -->\n        <div class=\"converter-section\" style=\"margin-top: 30px; background-color: #f9f9f9; padding: 20px; border-radius: 8px;\">\n            <h3>时间差计算<\/h3>\n            <div class=\"converter-row\" style=\"flex-wrap: wrap; gap: 10px;\">\n                <div style=\"flex: 1; min-width: 200px;\">\n                    <label style=\"display: block; margin-bottom: 5px;\">从<\/label>\n                    <input type=\"datetime-local\" id=\"timeFrom\" value=\"2026-04-24T22:29:33\" style=\"width: 100%;\">\n                <\/div>\n                <div style=\"flex: 1; min-width: 200px;\">\n                    <label style=\"display: block; margin-bottom: 5px;\">到<\/label>\n                    <input type=\"datetime-local\" id=\"timeTo\" value=\"2026-04-24T23:29:33\" style=\"width: 100%;\">\n                <\/div>\n                <div style=\"flex: 0 0 100px; align-self: flex-end;\">\n                    <button class=\"convert-btn\" onclick=\"calculateTimeDifference()\" style=\"width: 100%; padding: 10px;\">计算<\/button>\n                <\/div>\n            <\/div>\n            <div class=\"converter-row\" style=\"margin-top: 15px; flex-wrap: wrap; gap: 15px;\">\n                <div style=\"flex: 1; min-width: 100px;\">\n                    <input type=\"text\" id=\"daysResult\" placeholder=\"365天\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">天<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"monthsResult\" placeholder=\"月\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">月<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"weeksResult\" placeholder=\"周\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">周<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"hoursResult\" placeholder=\"小时\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">小时<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"minutesResult\" placeholder=\"分钟\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">分钟<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"secondsResult\" placeholder=\"秒\" style=\"width: 100%; text-align: center; border-left: 2px solid #4CAF50;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">秒<\/label>\n                <\/div>\n            <\/div>\n        <\/div>\n        \n        <!-- 时间转星期功能 -->\n        <div class=\"converter-section\" style=\"margin-top: 30px; background-color: #f9f9f9; padding: 20px; border-radius: 8px;\">\n            <h3>时间/时间戳转星期<\/h3>\n            <div class=\"converter-row\" style=\"justify-content: space-between; margin-bottom: 15px;\">\n                <label style=\"flex: 0 0 80px;\">时间<\/label>\n                <input type=\"date\" id=\"dateInput\" value=\"2026-04-24\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertDateToWeekday()\" style=\"flex: 0 0 120px;\">转星期 >><\/button>\n                <div class=\"result\" id=\"dateWeekdayResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('dateWeekdayResult')\" style=\"flex: 0 0 100px;\">点击复制<\/button>\n            <\/div>\n            <div class=\"converter-row\" style=\"justify-content: space-between;\">\n                <label style=\"flex: 0 0 80px;\">时间戳<\/label>\n                <input type=\"text\" id=\"timestampWeekdayInput\" placeholder=\"例如：1777041719\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertTimestampToWeekday()\" style=\"flex: 0 0 120px;\">转星期 >><\/button>\n                <div class=\"result\" id=\"timestampWeekdayResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('timestampWeekdayResult')\" style=\"flex: 0 0 100px;\">点击复制<\/button>\n            <\/div>\n        <\/div>\n        \n        <div class=\"knowledge-section\">\n            <h3>时间戳相关知识介绍<\/h3>\n            <p><strong>定义:<\/strong> 时间戳是指格林威治时间1970年01月01日00时00分00秒(北京时间1970年01月01日08时00分00秒)起至现在的总秒数。通俗的讲，时间戳是一份能够表示一份数据在一个特定时间点已经存在的完整的可验证的数据。它的提出主要是为用户提供一份电子证据，以证明用户的某些数据的产生时间。在实际应用上，它可以使用在包括电子商务、金融活动的各个方面，尤其可以用来支撑公开密钥基础设施的 &#8220;不可否认&#8221; 服务。<\/p>\n            <p><strong>分类:<\/strong><\/p>\n            <ul>\n                <li>1.自建时间戳: 此类时间戳是通过时间接收设备（如GPS，CDMA，北斗卫星）来获取时间到时间戳服务器上，并通过时间戳服务器签发时间戳证书。此种时间戳可用来企业内部责任认定，在法庭认证时并不具备法律效力。因其在通过时间接收设备接收时间时存在被篡改的可能，故此不能做为法律依据。<\/li>\n                <li>2.具有法律的效力的时间戳: 它是由我国中科院国家授时中心与北京联合信任技术服务有限公司负责建设的我国第三方可信时间默认认证服务。由国家授时中心负责时间的授时与守时监测。因其守时监测功能而保障时间戳证书中的时间的准确性和不被篡改。获取时间戳平台有 &#8220;大众版权保护平台&#8221; ，可与我国中科院国家授时中心时间同步。<\/li>\n            <\/ul>\n        <\/div>\n    <\/div>\n    \n    <script>\n        let timestampUpdateInterval;\n        let isUpdating = true;\n        \n        // 显示提示框\n        function showToast(message) {\n            // 创建提示框元素\n            let toast = document.createElement('div');\n            toast.className = 'toast';\n            toast.textContent = message;\n            document.body.appendChild(toast);\n            \n            // 显示提示框\n            setTimeout(() => {\n                toast.classList.add('show');\n            }, 10);\n            \n            // 3秒后隐藏提示框\n            setTimeout(() => {\n                toast.classList.remove('show');\n                setTimeout(() => {\n                    document.body.removeChild(toast);\n                }, 300);\n            }, 3000);\n        }\n        \n        // 初始化\n        function init() {\n            updateCurrentTimestamp();\n            startTimestampUpdate();\n        }\n        \n        // 更新当前时间戳\n        function updateCurrentTimestamp() {\n            const now = Math.floor(Date.now() / 1000); // 秒级时间戳\n            document.getElementById('currentTimestamp').textContent = now;\n        }\n        \n        // 开始时间戳更新\n        function startTimestampUpdate() {\n            if (timestampUpdateInterval) {\n                clearInterval(timestampUpdateInterval);\n            }\n            timestampUpdateInterval = setInterval(updateCurrentTimestamp, 1000);\n            isUpdating = true;\n            document.getElementById('stopBtn').textContent = '停止';\n        }\n        \n        // 切换时间戳更新状态\n        function toggleTimestampUpdate() {\n            if (isUpdating) {\n                clearInterval(timestampUpdateInterval);\n                isUpdating = false;\n                document.getElementById('stopBtn').textContent = '开始';\n            } else {\n                startTimestampUpdate();\n            }\n        }\n        \n        // 复制到剪贴板\n        function copyToClipboard(elementId) {\n            const element = document.getElementById(elementId);\n            const text = element.textContent;\n            \n            navigator.clipboard.writeText(text).then(function() {\n                showToast('复制成功！');\n            }).catch(function(err) {\n                console.error('复制失败:', err);\n                showToast('复制失败，请手动复制');\n            });\n        }\n        \n        // 时间戳转换为北京时间\n        function convertTimestampToBeijingTime() {\n            const timestamp = document.getElementById('timestampInput').value;\n            \n            if (!timestamp) {\n                showToast('请输入时间戳');\n                return;\n            }\n            \n            const timestampNum = parseInt(timestamp);\n            \n            if (isNaN(timestampNum)) {\n                showToast('请输入有效的时间戳');\n                return;\n            }\n            \n            // 处理不同长度的时间戳\n            let finalTimestamp = timestampNum;\n            if (timestamp.length === 10) {\n                // 秒级时间戳，转换为毫秒\n                finalTimestamp = timestampNum * 1000;\n            }\n            \n            const date = new Date(finalTimestamp);\n            // 北京时间（UTC+8）\n            const beijingTime = new Date(date.getTime() + 8 * 60 * 60 * 1000);\n            const formattedDate = beijingTime.toISOString().slice(0, 19).replace('T', ' ');\n            \n            document.getElementById('beijingTimeResult').textContent = formattedDate;\n        }\n        \n        // 北京时间转换为时间戳\n        function convertBeijingTimeToTimestamp() {\n            const beijingTimeStr = document.getElementById('beijingTimeInput').value;\n            \n            if (!beijingTimeStr) {\n                showToast('请选择日期时间');\n                return;\n            }\n            \n            // 转换为北京时间的Date对象\n            const date = new Date(beijingTimeStr);\n            // 转换为UTC时间（减去8小时）\n            const utcDate = new Date(date.getTime() - 8 * 60 * 60 * 1000);\n            const timestamp = Math.floor(utcDate.getTime() / 1000); // 秒级时间戳\n            \n            document.getElementById('timestampResult').textContent = timestamp;\n        }\n        \n        // 复制毫秒时间戳\n        function copyMilliseconds() {\n            const beijingTimeStr = document.getElementById('beijingTimeInput').value;\n            \n            if (!beijingTimeStr) {\n                showToast('请选择日期时间');\n                return;\n            }\n            \n            // 转换为北京时间的Date对象\n            const date = new Date(beijingTimeStr);\n            // 转换为UTC时间（减去8小时）\n            const utcDate = new Date(date.getTime() - 8 * 60 * 60 * 1000);\n            const milliseconds = utcDate.getTime(); // 毫秒级时间戳\n            \n            navigator.clipboard.writeText(milliseconds.toString()).then(function() {\n                showToast('复制毫秒成功！');\n            }).catch(function(err) {\n                console.error('复制失败:', err);\n                showToast('复制失败，请手动复制');\n            });\n        }\n        \n        // 计算时间差\n        function calculateTimeDifference() {\n            const timeFrom = document.getElementById('timeFrom').value;\n            const timeTo = document.getElementById('timeTo').value;\n            \n            if (!timeFrom || !timeTo) {\n                showToast('请选择开始和结束时间');\n                return;\n            }\n            \n            const startDate = new Date(timeFrom);\n            const endDate = new Date(timeTo);\n            \n            if (startDate >= endDate) {\n                showToast('开始时间必须早于结束时间');\n                return;\n            }\n            \n            // 计算时间差（毫秒）\n            const diffMs = endDate - startDate;\n            \n            // 计算各种时间单位\n            const seconds = Math.floor(diffMs / 1000);\n            const minutes = Math.floor(seconds / 60);\n            const hours = Math.floor(minutes / 60);\n            const days = Math.floor(hours / 24);\n            const weeks = Math.floor(days / 7);\n            \n            // 计算剩余时间\n            const remainingHours = hours % 24;\n            const remainingMinutes = minutes % 60;\n            const remainingSeconds = seconds % 60;\n            \n            // 显示结果\n            document.getElementById('daysResult').value = days + '天';\n            document.getElementById('monthsResult').value = Math.floor(days / 30) + '月';\n            document.getElementById('weeksResult').value = weeks + '周';\n            document.getElementById('daysOnlyResult').value = days + '天';\n            document.getElementById('hoursResult').value = remainingHours + '小时';\n            document.getElementById('minutesResult').value = remainingMinutes + '分钟';\n            document.getElementById('secondsResult').value = remainingSeconds + '秒';\n        }\n        \n        // 时间转星期\n        function convertDateToWeekday() {\n            const dateStr = document.getElementById('dateInput').value;\n            \n            if (!dateStr) {\n                showToast('请选择日期');\n                return;\n            }\n            \n            const date = new Date(dateStr);\n            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\n            const weekday = weekdays[date.getDay()];\n            \n            document.getElementById('dateWeekdayResult').textContent = weekday;\n        }\n        \n        // 时间戳转星期\n        function convertTimestampToWeekday() {\n            const timestamp = document.getElementById('timestampWeekdayInput').value;\n            \n            if (!timestamp) {\n                showToast('请输入时间戳');\n                return;\n            }\n            \n            const timestampNum = parseInt(timestamp);\n            \n            if (isNaN(timestampNum)) {\n                showToast('请输入有效的时间戳');\n                return;\n            }\n            \n            // 处理不同长度的时间戳\n            let finalTimestamp = timestampNum;\n            if (timestamp.length === 10) {\n                // 秒级时间戳，转换为毫秒\n                finalTimestamp = timestampNum * 1000;\n            }\n            \n            const date = new Date(finalTimestamp);\n            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\n            const weekday = weekdays[date.getDay()];\n            \n            document.getElementById('timestampWeekdayResult').textContent = weekday;\n        }\n        \n        // 初始化\n        init();\n    <\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="sourceEn">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2026/04/24/%e6%97%b6%e9%97%b4%e5%b0%8f%e5%b7%a5%e5%85%b7/)\n\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>时间戳转换工具<\/title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            line-height: 1.6;\n            margin: 0;\n            padding: 20px;\n            background-color: #f4f4f4;\n        }\n        .container {\n            max-width: 800px;\n            margin: 0 auto;\n            background-color: #fff;\n            padding: 20px;\n            border-radius: 8px;\n            box-shadow: 0 0 10px rgba(0,0,0,0.1);\n        }\n        h1 {\n            color: #333;\n            text-align: center;\n        }\n        .current-timestamp {\n            text-align: center;\n            margin-bottom: 20px;\n            font-size: 16px;\n        }\n        .current-timestamp span {\n            font-weight: bold;\n        }\n        .copy-btn {\n            background-color: #f0f0f0;\n            border: 1px solid #ddd;\n            padding: 2px 8px;\n            border-radius: 4px;\n            cursor: pointer;\n            font-size: 12px;\n            margin-left: 10px;\n        }\n        .copy-btn:hover {\n            background-color: #e0e0e0;\n        }\n        .stop-btn {\n            background-color: #f44336;\n            color: white;\n            border: none;\n            padding: 2px 8px;\n            border-radius: 4px;\n            cursor: pointer;\n            font-size: 12px;\n            margin-left: 10px;\n        }\n        .stop-btn:hover {\n            background-color: #d32f2f;\n        }\n        .converter-section {\n            margin-bottom: 20px;\n        }\n        .converter-row {\n            display: flex;\n            align-items: center;\n            margin-bottom: 10px;\n            flex-wrap: wrap;\n        }\n        .converter-row label {\n            width: 100px;\n            font-weight: bold;\n        }\n        .converter-row input {\n            flex: 1;\n            padding: 8px;\n            border: 1px solid #ddd;\n            border-radius: 4px;\n            margin-right: 10px;\n        }\n        .convert-btn {\n            background-color: #4CAF50;\n            color: white;\n            border: none;\n            padding: 8px 16px;\n            border-radius: 4px;\n            cursor: pointer;\n            margin-right: 10px;\n        }\n        .convert-btn:hover {\n            background-color: #45a049;\n        }\n        .result {\n            flex: 1;\n            padding: 8px;\n            border: 1px solid #ddd;\n            border-radius: 4px;\n            margin-right: 10px;\n            min-width: 150px;\n        }\n        .copy-result-btn {\n            background-color: #f0f0f0;\n            border: 1px solid #ddd;\n            padding: 8px 12px;\n            border-radius: 4px;\n            cursor: pointer;\n            font-size: 12px;\n            margin-right: 10px;\n        }\n        .copy-result-btn:hover {\n            background-color: #e0e0e0;\n        }\n        .links-section {\n            text-align: center;\n            margin: 20px 0;\n            padding: 10px;\n            background-color: #f9f9f9;\n            border-radius: 4px;\n        }\n        .links-section a {\n            margin: 0 10px;\n            color: #1976d2;\n            text-decoration: none;\n        }\n        .links-section a:hover {\n            text-decoration: underline;\n        }\n        .world-time-section {\n            margin: 30px 0;\n            padding: 20px;\n            background-color: #e3f2fd;\n            border-radius: 4px;\n        }\n        .world-time-section h3 {\n            text-align: center;\n            margin-top: 0;\n            color: #1976d2;\n        }\n        .timezone-selector {\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            margin: 10px 0;\n        }\n        .timezone-selector label {\n            margin-right: 10px;\n            font-weight: bold;\n        }\n        .timezone-selector select {\n            padding: 8px;\n            border: 1px solid #ddd;\n            border-radius: 4px;\n        }\n        .knowledge-section {\n            margin-top: 30px;\n            padding: 20px;\n            background-color: #f5f5f5;\n            border-radius: 4px;\n        }\n        .knowledge-section h3 {\n            margin-top: 0;\n            color: #333;\n        }\n        .knowledge-section p {\n            margin: 10px 0;\n        }\n        .knowledge-section ul {\n            margin: 10px 0;\n            padding-left: 20px;\n        }\n        .knowledge-section li {\n            margin: 5px 0;\n        }\n        @media (max-width: 768px) {\n            .converter-row {\n                flex-direction: column;\n                align-items: flex-start;\n            }\n            .converter-row label {\n                width: 100%;\n                margin-bottom: 5px;\n            }\n            .converter-row input,\n            .result {\n                width: 100%;\n                margin-right: 0;\n                margin-bottom: 10px;\n            }\n            .convert-btn,\n            .copy-result-btn {\n                margin-bottom: 10px;\n            }\n        }\n        /* 自定义提示框样式 */\n        .toast {\n            position: fixed;\n            top: 20px;\n            left: 50%;\n            transform: translateX(-50%) translateY(-20px);\n            background-color: #ffeb3b;\n            color: #333;\n            padding: 12px 20px;\n            border-radius: 4px;\n            z-index: 10000;\n            opacity: 0;\n            transition: opacity 0.3s, transform 0.3s;\n            font-weight: bold;\n            box-shadow: 0 2px 8px rgba(0,0,0,0.2);\n        }\n        .toast.show {\n            opacity: 1;\n            transform: translateX(-50%) translateY(0);\n        }\n        @media (max-width: 768px) {\n            .toast {\n                top: 10px;\n                left: 10px;\n                right: 10px;\n                transform: translateY(-20px);\n                text-align: center;\n            }\n            .toast.show {\n                transform: translateY(0);\n            }\n        }\n    <\/style>\n<\/head>\n<body>\n    <div class=\"container\">\n        <h1>时间戳转换工具<\/h1>\n        \n        <div class=\"current-timestamp\">\n            当前时间戳: <span id=\"currentTimestamp\">1777040332<\/span> \n            <button class=\"copy-btn\" onclick=\"copyToClipboard('currentTimestamp')\">点击复制<\/button>\n            <button class=\"stop-btn\" onclick=\"toggleTimestampUpdate()\" id=\"stopBtn\">停止<\/button>\n        <\/div>\n        \n        <div class=\"converter-section\">\n            <div class=\"converter-row\" style=\"justify-content: space-between;\">\n                <label style=\"flex: 0 0 80px;\">时间戳<\/label>\n                <input type=\"text\" id=\"timestampInput\" placeholder=\"例如：1777040332\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertTimestampToBeijingTime()\" style=\"flex: 0 0 100px;\">转换 >><\/button>\n                <div class=\"result\" id=\"beijingTimeResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('beijingTimeResult')\" style=\"flex: 0 0 120px;\">北京时间 (点击复制)<\/button>\n            <\/div>\n            \n            <div class=\"converter-row\" style=\"justify-content: space-between; margin-top: 15px;\">\n                <label style=\"flex: 0 0 80px;\">北京时间<\/label>\n                <input type=\"datetime-local\" id=\"beijingTimeInput\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertBeijingTimeToTimestamp()\" style=\"flex: 0 0 100px;\">转换 >><\/button>\n                <div class=\"result\" id=\"timestampResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <div style=\"display: flex; gap: 10px;\">\n                    <button class=\"copy-result-btn\" onclick=\"copyToClipboard('timestampResult')\">时间戳 (点击复制)<\/button>\n                    <button class=\"copy-result-btn\" onclick=\"copyMilliseconds()\">复制毫秒<\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n        \n        <!-- 时间差计算功能 -->\n        <div class=\"converter-section\" style=\"margin-top: 30px; background-color: #f9f9f9; padding: 20px; border-radius: 8px;\">\n            <h3>时间差计算<\/h3>\n            <div class=\"converter-row\" style=\"flex-wrap: wrap; gap: 10px;\">\n                <div style=\"flex: 1; min-width: 200px;\">\n                    <label style=\"display: block; margin-bottom: 5px;\">从<\/label>\n                    <input type=\"datetime-local\" id=\"timeFrom\" value=\"2026-04-24T22:29:33\" style=\"width: 100%;\">\n                <\/div>\n                <div style=\"flex: 1; min-width: 200px;\">\n                    <label style=\"display: block; margin-bottom: 5px;\">到<\/label>\n                    <input type=\"datetime-local\" id=\"timeTo\" value=\"2026-04-24T23:29:33\" style=\"width: 100%;\">\n                <\/div>\n                <div style=\"flex: 0 0 100px; align-self: flex-end;\">\n                    <button class=\"convert-btn\" onclick=\"calculateTimeDifference()\" style=\"width: 100%; padding: 10px;\">计算<\/button>\n                <\/div>\n            <\/div>\n            <div class=\"converter-row\" style=\"margin-top: 15px; flex-wrap: wrap; gap: 15px;\">\n                <div style=\"flex: 1; min-width: 100px;\">\n                    <input type=\"text\" id=\"daysResult\" placeholder=\"365天\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">天<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"monthsResult\" placeholder=\"月\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">月<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"weeksResult\" placeholder=\"周\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">周<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"hoursResult\" placeholder=\"小时\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">小时<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"minutesResult\" placeholder=\"分钟\" style=\"width: 100%; text-align: center;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">分钟<\/label>\n                <\/div>\n                <div style=\"flex: 1; min-width: 80px;\">\n                    <input type=\"text\" id=\"secondsResult\" placeholder=\"秒\" style=\"width: 100%; text-align: center; border-left: 2px solid #4CAF50;\">\n                    <label style=\"display: block; text-align: center; margin-top: 5px; font-size: 12px;\">秒<\/label>\n                <\/div>\n            <\/div>\n        <\/div>\n        \n        <!-- 时间转星期功能 -->\n        <div class=\"converter-section\" style=\"margin-top: 30px; background-color: #f9f9f9; padding: 20px; border-radius: 8px;\">\n            <h3>时间/时间戳转星期<\/h3>\n            <div class=\"converter-row\" style=\"justify-content: space-between; margin-bottom: 15px;\">\n                <label style=\"flex: 0 0 80px;\">时间<\/label>\n                <input type=\"date\" id=\"dateInput\" value=\"2026-04-24\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertDateToWeekday()\" style=\"flex: 0 0 120px;\">转星期 >><\/button>\n                <div class=\"result\" id=\"dateWeekdayResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('dateWeekdayResult')\" style=\"flex: 0 0 100px;\">点击复制<\/button>\n            <\/div>\n            <div class=\"converter-row\" style=\"justify-content: space-between;\">\n                <label style=\"flex: 0 0 80px;\">时间戳<\/label>\n                <input type=\"text\" id=\"timestampWeekdayInput\" placeholder=\"例如：1777041719\" style=\"flex: 1; margin-right: 10px;\">\n                <button class=\"convert-btn\" onclick=\"convertTimestampToWeekday()\" style=\"flex: 0 0 120px;\">转星期 >><\/button>\n                <div class=\"result\" id=\"timestampWeekdayResult\" style=\"flex: 1; margin: 0 10px;\"><\/div>\n                <button class=\"copy-result-btn\" onclick=\"copyToClipboard('timestampWeekdayResult')\" style=\"flex: 0 0 100px;\">点击复制<\/button>\n            <\/div>\n        <\/div>\n        \n        <div class=\"knowledge-section\">\n            <h3>时间戳相关知识介绍<\/h3>\n            <p><strong>定义:<\/strong> 时间戳是指格林威治时间1970年01月01日00时00分00秒(北京时间1970年01月01日08时00分00秒)起至现在的总秒数。通俗的讲，时间戳是一份能够表示一份数据在一个特定时间点已经存在的完整的可验证的数据。它的提出主要是为用户提供一份电子证据，以证明用户的某些数据的产生时间。在实际应用上，它可以使用在包括电子商务、金融活动的各个方面，尤其可以用来支撑公开密钥基础设施的 &#8220;不可否认&#8221; 服务。<\/p>\n            <p><strong>分类:<\/strong><\/p>\n            <ul>\n                <li>1.自建时间戳: 此类时间戳是通过时间接收设备（如GPS，CDMA，北斗卫星）来获取时间到时间戳服务器上，并通过时间戳服务器签发时间戳证书。此种时间戳可用来企业内部责任认定，在法庭认证时并不具备法律效力。因其在通过时间接收设备接收时间时存在被篡改的可能，故此不能做为法律依据。<\/li>\n                <li>2.具有法律的效力的时间戳: 它是由我国中科院国家授时中心与北京联合信任技术服务有限公司负责建设的我国第三方可信时间默认认证服务。由国家授时中心负责时间的授时与守时监测。因其守时监测功能而保障时间戳证书中的时间的准确性和不被篡改。获取时间戳平台有 &#8220;大众版权保护平台&#8221; ，可与我国中科院国家授时中心时间同步。<\/li>\n            <\/ul>\n        <\/div>\n    <\/div>\n    \n    <script>\n        let timestampUpdateInterval;\n        let isUpdating = true;\n        \n        // 显示提示框\n        function showToast(message) {\n            // 创建提示框元素\n            let toast = document.createElement('div');\n            toast.className = 'toast';\n            toast.textContent = message;\n            document.body.appendChild(toast);\n            \n            // 显示提示框\n            setTimeout(() => {\n                toast.classList.add('show');\n            }, 10);\n            \n            // 3秒后隐藏提示框\n            setTimeout(() => {\n                toast.classList.remove('show');\n                setTimeout(() => {\n                    document.body.removeChild(toast);\n                }, 300);\n            }, 3000);\n        }\n        \n        // 初始化\n        function init() {\n            updateCurrentTimestamp();\n            startTimestampUpdate();\n        }\n        \n        // 更新当前时间戳\n        function updateCurrentTimestamp() {\n            const now = Math.floor(Date.now() / 1000); // 秒级时间戳\n            document.getElementById('currentTimestamp').textContent = now;\n        }\n        \n        // 开始时间戳更新\n        function startTimestampUpdate() {\n            if (timestampUpdateInterval) {\n                clearInterval(timestampUpdateInterval);\n            }\n            timestampUpdateInterval = setInterval(updateCurrentTimestamp, 1000);\n            isUpdating = true;\n            document.getElementById('stopBtn').textContent = '停止';\n        }\n        \n        // 切换时间戳更新状态\n        function toggleTimestampUpdate() {\n            if (isUpdating) {\n                clearInterval(timestampUpdateInterval);\n                isUpdating = false;\n                document.getElementById('stopBtn').textContent = '开始';\n            } else {\n                startTimestampUpdate();\n            }\n        }\n        \n        // 复制到剪贴板\n        function copyToClipboard(elementId) {\n            const element = document.getElementById(elementId);\n            const text = element.textContent;\n            \n            navigator.clipboard.writeText(text).then(function() {\n                showToast('复制成功！');\n            }).catch(function(err) {\n                console.error('复制失败:', err);\n                showToast('复制失败，请手动复制');\n            });\n        }\n        \n        // 时间戳转换为北京时间\n        function convertTimestampToBeijingTime() {\n            const timestamp = document.getElementById('timestampInput').value;\n            \n            if (!timestamp) {\n                showToast('请输入时间戳');\n                return;\n            }\n            \n            const timestampNum = parseInt(timestamp);\n            \n            if (isNaN(timestampNum)) {\n                showToast('请输入有效的时间戳');\n                return;\n            }\n            \n            // 处理不同长度的时间戳\n            let finalTimestamp = timestampNum;\n            if (timestamp.length === 10) {\n                // 秒级时间戳，转换为毫秒\n                finalTimestamp = timestampNum * 1000;\n            }\n            \n            const date = new Date(finalTimestamp);\n            // 北京时间（UTC+8）\n            const beijingTime = new Date(date.getTime() + 8 * 60 * 60 * 1000);\n            const formattedDate = beijingTime.toISOString().slice(0, 19).replace('T', ' ');\n            \n            document.getElementById('beijingTimeResult').textContent = formattedDate;\n        }\n        \n        // 北京时间转换为时间戳\n        function convertBeijingTimeToTimestamp() {\n            const beijingTimeStr = document.getElementById('beijingTimeInput').value;\n            \n            if (!beijingTimeStr) {\n                showToast('请选择日期时间');\n                return;\n            }\n            \n            // 转换为北京时间的Date对象\n            const date = new Date(beijingTimeStr);\n            // 转换为UTC时间（减去8小时）\n            const utcDate = new Date(date.getTime() - 8 * 60 * 60 * 1000);\n            const timestamp = Math.floor(utcDate.getTime() / 1000); // 秒级时间戳\n            \n            document.getElementById('timestampResult').textContent = timestamp;\n        }\n        \n        // 复制毫秒时间戳\n        function copyMilliseconds() {\n            const beijingTimeStr = document.getElementById('beijingTimeInput').value;\n            \n            if (!beijingTimeStr) {\n                showToast('请选择日期时间');\n                return;\n            }\n            \n            // 转换为北京时间的Date对象\n            const date = new Date(beijingTimeStr);\n            // 转换为UTC时间（减去8小时）\n            const utcDate = new Date(date.getTime() - 8 * 60 * 60 * 1000);\n            const milliseconds = utcDate.getTime(); // 毫秒级时间戳\n            \n            navigator.clipboard.writeText(milliseconds.toString()).then(function() {\n                showToast('复制毫秒成功！');\n            }).catch(function(err) {\n                console.error('复制失败:', err);\n                showToast('复制失败，请手动复制');\n            });\n        }\n        \n        // 计算时间差\n        function calculateTimeDifference() {\n            const timeFrom = document.getElementById('timeFrom').value;\n            const timeTo = document.getElementById('timeTo').value;\n            \n            if (!timeFrom || !timeTo) {\n                showToast('请选择开始和结束时间');\n                return;\n            }\n            \n            const startDate = new Date(timeFrom);\n            const endDate = new Date(timeTo);\n            \n            if (startDate >= endDate) {\n                showToast('开始时间必须早于结束时间');\n                return;\n            }\n            \n            // 计算时间差（毫秒）\n            const diffMs = endDate - startDate;\n            \n            // 计算各种时间单位\n            const seconds = Math.floor(diffMs / 1000);\n            const minutes = Math.floor(seconds / 60);\n            const hours = Math.floor(minutes / 60);\n            const days = Math.floor(hours / 24);\n            const weeks = Math.floor(days / 7);\n            \n            // 计算剩余时间\n            const remainingHours = hours % 24;\n            const remainingMinutes = minutes % 60;\n            const remainingSeconds = seconds % 60;\n            \n            // 显示结果\n            document.getElementById('daysResult').value = days + '天';\n            document.getElementById('monthsResult').value = Math.floor(days / 30) + '月';\n            document.getElementById('weeksResult').value = weeks + '周';\n            document.getElementById('daysOnlyResult').value = days + '天';\n            document.getElementById('hoursResult').value = remainingHours + '小时';\n            document.getElementById('minutesResult').value = remainingMinutes + '分钟';\n            document.getElementById('secondsResult').value = remainingSeconds + '秒';\n        }\n        \n        // 时间转星期\n        function convertDateToWeekday() {\n            const dateStr = document.getElementById('dateInput').value;\n            \n            if (!dateStr) {\n                showToast('请选择日期');\n                return;\n            }\n            \n            const date = new Date(dateStr);\n            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\n            const weekday = weekdays[date.getDay()];\n            \n            document.getElementById('dateWeekdayResult').textContent = weekday;\n        }\n        \n        // 时间戳转星期\n        function convertTimestampToWeekday() {\n            const timestamp = document.getElementById('timestampWeekdayInput').value;\n            \n            if (!timestamp) {\n                showToast('请输入时间戳');\n                return;\n            }\n            \n            const timestampNum = parseInt(timestamp);\n            \n            if (isNaN(timestampNum)) {\n                showToast('请输入有效的时间戳');\n                return;\n            }\n            \n            // 处理不同长度的时间戳\n            let finalTimestamp = timestampNum;\n            if (timestamp.length === 10) {\n                // 秒级时间戳，转换为毫秒\n                finalTimestamp = timestampNum * 1000;\n            }\n            \n            const date = new Date(finalTimestamp);\n            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];\n            const weekday = weekdays[date.getDay()];\n            \n            document.getElementById('timestampWeekdayResult').textContent = weekday;\n        }\n        \n        // 初始化\n        init();\n    <\/script>\n<\/body>\n<\/html>\n"</script>

  function apply(lang){
    document.documentElement.lang=lang==="en"?"en":"zh-CN";
    document.querySelectorAll("[data-zh][data-en]").forEach(function(el){el.textContent=el.dataset[lang];});
    document.title=document.body.dataset["title"+(lang==="en"?"En":"Zh")]+" · snowCrane";
    document.getElementById("langToggle").textContent=lang==="en"?"中文":"EN";
    if(window.setArticleLanguage) window.setArticleLanguage(lang);
    localStorage.setItem("snowcrane-lang",lang);
  }
  document.getElementById("langToggle").onclick=function(){
    apply(document.documentElement.lang==="en"?"zh":"en");
  };
  apply(localStorage.getItem("snowcrane-lang")==="en"?"en":"zh");
})();
</script>
</body></html>
