<h1 data-zh="域控制器 OEM 出货与主机厂采购格局（2025.6 — 2026.6）" data-en="Domain controller OEM shipments and OEM procurement pattern (2025.6 — 2026.6)">域控制器 OEM 出货与主机厂采购格局（2025.6 — 2026.6）</h1>
<p class="summary" data-zh="覆盖 2025-2026 年座舱+智驾域控的供应商排名、主机厂采购格局、出货量与市场份额变化。" data-en="Covers the supplier ranking of cockpit + smart driving domain control, OEM procurement pattern, shipment volume and market share changes in 2025-2026.">覆盖 2025-2026 年座舱+智驾域控的供应商排名、主机厂采购格局、出货量与市场份额变化。</p>
<p class="tags" data-zh="#智能汽车 #域控制器 #舱驾一体 #供应链" data-en="#smart car #domain controller #Integrated cabin and driving #supply chain">#智能汽车 #域控制器 #舱驾一体 #供应链</p>
<div id="content" class="markdown"></div>
<script type="application/json" id="sourceZh">"> 数据来源：佐思汽研、盖世汽车研究院、高工智能汽车研究院\n\n## 1. 座舱域控制器供应商排名\n\n### 1.1 2025 全年趋势\n\n| 时间段 | 第一名 | 份额 | 装机量 | 第二名 | 份额 | 第三名 | 份额 |\n|--------|--------|------|--------|--------|------|--------|------|\n| 2025年1-2月 | 德赛西威 | 19.3% | 21.8万套 | 博世 | 10.4% | 车联天下 | 7.3% |\n| 2025年1-4月 | 德赛西威 | ~20% | — | 博世 | ~9.5% | 车联天下 | ~7.4% |\n| 2025年1-7月 | 德赛西威 | 15.6% | 75万+套 | 博世 | ~8% | 车联天下 | ~7% |\n| 2025年1-11月 | 德赛西威 | 16.1% | 137万套 | 博世 | 8.7% | — | — |\n| **2025全年** | **座舱域控前装搭载率突破 40%** | 交付量 **927万辆** | | | | | |\n\n### 1.2 2026年最新数据\n\n**2026年1月**（佐思汽研）:\n- 座舱域控标配装配量：**90.3万辆**，同比+8.8%\n- 装配率：**59.6%**（较2025年同期+13.2个百分点）\n\n**2026年1-2月 TOP10**（盖世汽车研究院）:\n\n| 排名 | 供应商 | 装机量 | 市场份额 |\n|------|--------|--------|---------|\n| 1 | **德赛西威** | 214,209套 | 15.5% |\n| 2 | **博世** | 127,439套 | 9.2% |\n| 3 | **华为技术** | 106,111套 | 7.7% |\n| 4 | 亿咖通 | ~7%区间 | ~6-7% |\n| 5 | 蜂巢电子 | ~6%区间 | ~5-6% |\n| 6 | 车联天下 | ~6%区间 | ~5-6% |\n| 7 | 哈曼 | — | ~5% |\n| 8 | 均联智行 | — | ~4% |\n| 9 | 华阳通用 | — | ~4% |\n| 10 | 和硕/广达(特斯拉) | — | ~3-4% |\n\n**关键变化**: 华为从2025年1-2月的第8名(4.3%)跃升至2026年1-2月的第3名(7.7%)，主要受问界/享界/智界车型拉动。\n\n### 1.3 座舱域控芯片格局\n\n| 排名 | 芯片厂商 | 2025年1-11月份额 | 2026年1-2月份额 | 趋势 |\n|------|---------|-----------------|----------------|------|\n| 1 | **高通** (8155/8295) | 73.3% (636万+颗) | 72.1% (101.4万颗) | 绝对垄断，缓慢下降 |\n| 2 | **华为海思** | 6.8% | 7.9% | 稳步上升 |\n| 3 | **芯擎科技** (SE1000) | ~5% | 5.3% | 国产替代先锋 |\n| 4 | **超威半导体 (AMD)** | — | ~4.5% | 新进入者 |\n| 5 | **联发科** | — | ~3% | |\n| 6 | **芯驰科技** | — | ~2-3% | |\n\n30万以下国产车市场中，芯擎科技以 **46.13%** 领跑国产座舱芯片，华为海思 **30.88%** 紧随其后。\n\n## 2. 智驾域控制器供应商排名\n\n### 2.1 2025年数据\n\n**2025年1-4月 TOP供应商**（盖世汽车研究院）:\n\n| 排名 | 供应商 | 市场份额 | 说明 |\n|------|--------|---------|------|\n| 1 | **德赛西威** | 26.1% | Tier1 技术积淀 |\n| 2 | **比亚迪** | 24.7% | 垂直整合自研 |\n| 3 | **华为** | 11.5% | 技术赋能（ADS方案） |\n| 4 | 和硕/广达(特斯拉) | ~8% | FSD 专供 |\n| 5-10 | 经纬恒润/博世/知行科技等 | — | |\n\n**2025年前三季度**（NE时代）:\n- 比亚迪、德赛西威、华为三者合计市场份额高达 **66.2%**\n- 比亚迪因天神之眼大规模上车，份额提升近 30 个百分点\n\n### 2.2 2026年1月最新数据（佐思汽研）\n\n- 智驾域控装配量：**43.4万辆**，同比+44.7%\n- 装配率：**28.7%**，较上年同期+11.9个百分点\n- TOP3 供应商占比 **50%**\n\n| 排名 | 供应商 | 装配量 | 市占率 |\n|------|--------|--------|--------|\n| 1 | **比亚迪** | 7.8万辆 | 17.9% |\n| 2 | **华为** | — | ~15-24% (分价位段差异大) |\n| 3 | **德赛西威** | 6.8万辆 | 15.6% |\n| 4 | **小米** | — | 8.8% (YU7系列) |\n| 5-10 | 经纬恒润/博世/知行/Momenta等 | — | — |\n\n**品牌维度 TOP10**:\n- 比亚迪 5.1万辆 (11.7%)\n- 小米、理想、蔚来装配率达 **100%**（智驾域控成标配）\n- TOP10品牌合计占市场 62.5%\n\n### 2.3 智驾域控芯片格局\n\n| 芯片 | 2025年1月份额 | 说明 |\n|------|--------------|------|\n| **英伟达 Orin-X** | 61.3% (34.3万颗) | 绝对主导 |\n| **特斯拉 FSD** | 12.1% (6.7万颗) | 仅自用 |\n| **华为昇腾610** | 7.6% (4.3万颗) | 快速增长 |\n| **地平线 征程3/5** | 5.9% | 定点客户广泛 |\n| **TI TDA4** | ~5% | 中低端方案 |\n\n## 3. 主机厂域控采购策略\n\n### 3.1 自研 vs 外采分布\n\n```\n                    自研程度\n          高 ←──────────────────→ 低\n          │                       │\n   ┌──────┴──────┐        ┌──────┴──────┐\n   │ 全栈自研     │        │ 全部外采     │\n   │ (芯片+域控)  │        │ (Tier1方案)  │\n   │             │        │             │\n   │ 特斯拉       │        │ 广汽        │\n   │ 比亚迪       │        │ 长安(部分)   │\n   │             │        │ 东风日产     │\n   └──────┬──────┘        └──────┬──────┘\n          │                       │\n   ┌──────┴──────┐        ┌──────┴──────┐\n   │ 高端自研     │        │ 战略合作     │\n   │ 低端外采     │        │ (深度绑定)   │\n   │             │        │             │\n   │ 小鹏(图灵)  │        │ 理想+德赛    │\n   │ 蔚来(神玑)  │        │ 问界+华为    │\n   │ 吉利(亿咖通)│        │ 长城+毫末    │\n   └─────────────┘        └─────────────┘\n```\n\n### 3.2 各主机厂详细采购关系\n\n| 主机厂 | 智驾域控供应商 | 座舱域控供应商 | 芯片选择 | 策略 |\n|--------|--------------|--------------|---------|------|\n| **比亚迪** | 自研(天神之眼) | 自研+德赛西威 | 自研+地平线J6 | 全栈自研，低端外采 |\n| **特斯拉** | 自研(FSD) | 和硕/广达代工 | 自研FSD芯片 | 纯自研 |\n| **华为系** (问界/享界/智界) | 华为ADS | 华为座舱 | 昇腾610+麒麟 | 华为全栈方案 |\n| **理想** | 德赛西威+自研(舒马赫) | 德赛西威 | Orin-X→自研 | 深度绑定德赛，高端自研 |\n| **小鹏** | 自研(图灵芯片)+经纬恒润(低端) | 德赛西威 | 自研图灵+Orin | 高端自研，低端外采 |\n| **蔚来** | 自研(神玑NX9031)+Momenta | 德赛西威 | 自研(1000+TOPS) | ET9自研，低端外采 |\n| **小米** | 自研 | — | Orin-X | 自研为主 |\n| **吉利** | 亿咖通+德赛西威+地平线 | 亿咖通+德赛西威 | 高通8295+芯擎 | 多元化供应 |\n| **长城** | 毫末智行+元戎启行+大疆卓驭 | 德赛西威 | Orin+地平线J5 | 多供应商竞争 |\n| **广汽** | 德赛西威 | 德赛西威 | Orin-X | 外采为主 |\n| **长安** | 华为(阿维塔)+自研(深蓝) | — | 昇腾+Orin | 双线并行 |\n| **奇瑞** | 德赛西威+地平线 | 德赛西威 | Orin+征程5 | 外采为主 |\n| **上汽** | 德赛西威+Momenta | — | Orin | 外采+战略投资 |\n\n### 3.3 德赛西威客户版图\n\n德赛西威是目前定点覆盖最广的域控供应商，客户超 80 家整车厂：\n\n```\n德赛西威域控定点客户:\n\n自主品牌: 理想 | 小鹏 | 蔚来 | 小米 | 比亚迪 | 吉利 | 奇瑞 | 长城 | 广汽 | 长安 | 上汽\n合资品牌: 广汽丰田 | 东风日产 | 上汽通用\n海外品牌: 丰田 | 大众\n\n关键产品:\n├── IPU04 (Orin-X) → 理想/上汽/广汽/长城 智驾域控\n├── IPU14 (Thor)   → 广汽昊铂L4 (2025年量产)\n├── 第四代座舱域控  → 理想/吉利/广汽埃安/集度\n└── 中央计算平台    → 多家定点中\n```\n\n## 4. 行业趋势与预测\n\n### 4.1 市场规模\n\n| 预测机构 | 2025年 | 2030年 |\n|---------|--------|--------|\n| 麦肯锡(全球) | 1280亿美元 | 1560亿美元 |\n| 国盛证券(中国) | 1675亿元 | 3759亿元 |\n| 其中：智能座舱域控 | 349亿元 | 404亿元 |\n| 其中：自动驾驶域控 | 871亿元 | 1603亿元 |\n\n### 4.2 关键趋势\n\n1. **自研与外采并存**：地平线创始人余凯判断，**20%车企选择自研，80%依然选择第三方合作**\n2. **国产替代加速**：座舱域控前十供应商中，国产占七席（52.7%）；智驾域控 TOP3 全部为本土企业（66.2%）\n3. **舱驾融合**：单一域控→中央计算平台趋势明确，德赛西威 IPU14 (Thor) 率先量产\n4. **智驾下沉**：2026年1月智驾域控装配率已达 28.7%，月度渗透率首超 30%，NOA 功能从 20万+ 下探至 10万级\n5. **芯片国产化**：高通座舱份额从 75.9% 降至 72.1%，芯擎/华为/芯驰合计提升至 ~15%\n\n### 4.3 竞争格局预判（2026下半年）\n\n| 领域 | 第一梯队 | 第二梯队 | 潜力股 |\n|------|---------|---------|--------|\n| 座舱域控供应商 | 德赛西威(~15%) | 博世/华为/亿咖通(7-9%) | 蜂巢电子/镁佳科技 |\n| 智驾域控供应商 | 比亚迪/华为/德赛西威 | 小米/经纬恒润 | Momenta/知行科技 |\n| 座舱芯片 | 高通(~70%) | 华为/芯擎(~13%) | 芯驰/联发科 |\n| 智驾芯片 | 英伟达(~55%) | 华为昇腾/地平线(~20%) | 黑芝麻/后摩智能 |\n\n---\n\n## 数据来源\n\n- [2025年1-4月智能座舱供应商装机量排行榜 — 盖世汽车研究院](https://i.gasgoo.com/news/70426903.html)\n- [2025年1-4月ADAS供应商装机量排行榜 — 知乎](https://zhuanlan.zhihu.com/p/1916865943386173711)\n- [2026年1月智驾域控装配率28.7%，TOP3供应商占比50% — 佐思汽研](https://zhuanlan.zhihu.com/p/2025169444607987990)\n- [2026年1-2月智能座舱供应商装机量排行榜 — 盖世汽车研究院](https://i.gasgoo.com/news/70452902.html)\n- [2026年1月座舱域控迎新一轮洗牌 — 华盛通](https://www.hstong.com/news/detail/26032616453526381)\n- [智能座舱\"大脑\"No.1冲刺港股 — 量子位](https://www.qbitai.com/2026/04/400567.html)\n- [智驾平权之车企智驾方案梳理 — 知乎](https://zhuanlan.zhihu.com/p/1894467105199457266)\n- [2025年1-11月智能座舱供应商装机量排行榜 — 盖世汽车研究院](https://i.gasgoo.com/news/70442273.html)\n- [2025座舱域控榜单：芯擎科技领跑国产芯片 — 知乎](https://zhuanlan.zhihu.com/p/2012109951158477835)\n- [智能辅助驾驶域控研究：月度渗透率首超30% — 知乎](https://zhuanlan.zhihu.com/p/1963616929592906089)\n"</script>
<script type="application/json" id="sourceEn">"> Data source: Zuosi Auto Research, Gasgoo Automotive Research Institute, Gaogong Intelligent Automotive Research Institute\n\n## 1. Cockpit domain controller supplier ranking\n\n### 1.1 2025 full-year trends\n\n| Time period | First place | Share | Installed capacity | Second place | Share | Third place | Share |\n|--------|--------|------|--------|--------|------|--------|------|\n| January-February 2025 | Desay SV | 19.3% | 218,000 units | Bosch | 10.4% | Autolink World | 7.3% |\n| January-April 2025 | Desay SV | ~20% | — | Bosch | ~9.5% | Autolink World | ~7.4% |\n| January-July 2025 | Desay SV | 15.6% | 750,000+ sets | Bosch | ~8% | Autolink World | ~7% |\n| January-November 2025 | Desay SV | 16.1% | 1.37 million units | Bosch | 8.7% | — | — |\n| **Full year 2025** | **Cockpit domain control pre-installation rate exceeds 40%** | Delivery volume **9.27 million vehicles** | | | | | |\n\n### 1.2 Latest data in 2026\n\n**January 2026** (Zosi Auto Research):\n- Cockpit domain control standard assembly volume: **903,000 units**, +8.8% year-on-year\n- Assembly rate: **59.6%** (+13.2 percentage points compared to the same period in 2025)\n\n**January-February 2026 TOP10** (Gasgoo Automotive Research Institute):\n\n| Ranking | Suppliers | Installed Capacity | Market Share |\n|------|--------|--------|---------|\n| 1 | **Desay SV** | 214,209 sets | 15.5% |\n| 2 | **Bosch** | 127,439 units | 9.2% |\n| 3 | **Huawei Technologies** | 106,111 sets | 7.7% |\n| 4 | Yikatong | ~7% range | ~6-7% |\n| 5 | Honeycomb Electronics | ~6% range | ~5-6% |\n| 6 | AutoLink World | ~6% range | ~5-6% |\n| 7 | Harman | — | ~5% |\n| 8 | Junlianzhixing | — | ~4% |\n| 9 | Huayang General | — | ~4% |\n| 10 | Pegatron/Quanta (Tesla) | — | ~3-4% |\n\n**Key changes**: Huawei jumped from 8th place (4.3%) in January-February 2025 to 3rd place (7.7%) in January-February 2026, mainly driven by Wenjie/Xiangjie/Smart World models.\n\n### 1.3 Cockpit domain control chip layout\n\n| Ranking | Chip Manufacturers | Share from January to November 2025 | Share from January to February 2026 | Trends |\n|------|---------|------------------|----------------|------|\n| 1 | **Qualcomm** (8155/8295) | 73.3% (6.36 million+ units) | 72.1% (1.014 million units) | Absolute monopoly, slowly declining |\n| 2 | **Huawei HiSilicon** | 6.8% | 7.9% | Steady rise |\n| 3 | **Xinqing Technology** (SE1000) | ~5% | 5.3% | Domestic alternative pioneer |\n| 4 | **Advanced Semiconductor (AMD)** | — | ~4.5% | New Entrant |\n| 5 | **MediaTek** | — | ~3% | |\n| 6 | **Xinchi Technology** | — | ~2-3% | |\n\nIn the domestic car market with prices below RMB 300,000, Xinqing Technology leads the domestic cockpit chip market with **46.13%**, followed by Huawei HiSilicon with **30.88%**.\n\n## 2. Ranking of Smart Driving Domain Controller Suppliers\n\n### 2.1 2025 data\n\n**TOP suppliers from January to April 2025** (Gasgoo Automotive Research Institute):\n\n| Ranking | Suppliers | Market Share | Description |\n|------|--------|---------|------|\n| 1 | **Desay SV** | 26.1% | Tier1 technology accumulation |\n| 2 | **BYD** | 24.7% | Vertically integrated self-research |\n| 3 | **Huawei** | 11.5% | Technology empowerment (ADS solution) |\n| 4 | Pegatron/Quanta (Tesla) | ~8% | Exclusively for FSD |\n| 5-10 | Jingwei Hengrun/Bosch/Zhixing Technology, etc. | — | |\n\n**First three quarters of 2025** (NE era):\n- BYD, Desay SV, and Huawei have a combined market share of **66.2%**\n- BYD’s share increased by nearly 30 percentage points due to the large-scale launch of Eye of the Gods\n\n### 2.2 Latest data in January 2026 (Zosi Auto Research)\n\n- Smart driving domain control assembly volume: **434,000 units**, +44.7% year-on-year\n- Assembly rate: **28.7%**, +11.9 percentage points compared with the same period last year\n- Proportion of TOP3 suppliers **50%**\n\n| Ranking | Suppliers | Assembly Volume | Market Share |\n|------|--------|--------|--------|\n| 1 | **BYD** | 78,000 vehicles | 17.9% |\n| 2 | **Huawei** | — | ~15-24% (big difference in price range) |\n| 3 | **Desay SV** | 68,000 vehicles | 15.6% |\n| 4 | **Xiaomi** | — | 8.8% (YU7 series) |\n| 5-10 | Jingwei Hengrun/Bosch/Zhixing/Momenta, etc. | — | — |\n\n**Brand dimension TOP10**:\n- BYD 51,000 units (11.7%)\n- The assembly rate of Xiaomi, Ideal and NIO reaches **100%** (smart driving domain control is standard)\n- TOP10 brands together account for 62.5% of the market\n\n### 2.3 Intelligent driving domain control chip pattern\n\n| Chip | Share in January 2025 | Description |\n|------|--------------|------|\n| **NVIDIA Orin-X** | 61.3% (343,000 units) | Absolute dominance |\n| **Tesla FSD** | 12.1% (67,000 units) | Personal use only |\n| **Huawei Ascend 610** | 7.6% (43,000 units) | Rapid growth |\n| **Horizon Journey 3/5** | 5.9% | Wide range of designated customers |\n| **TI TDA4** | ~5% | Mid- to low-end solutions |\n\n## 3. Host manufacturer domain control procurement strategy\n\n### 3.1 Self-research vs. external procurement distribution\n\n\n\n```\n                    自研程度\n          高 ←──────────────────→ 低\n          │                       │\n   ┌──────┴──────┐        ┌──────┴──────┐\n   │ 全栈自研     │        │ 全部外采     │\n   │ (芯片+域控)  │        │ (Tier1方案)  │\n   │             │        │             │\n   │ 特斯拉       │        │ 广汽        │\n   │ 比亚迪       │        │ 长安(部分)   │\n   │             │        │ 东风日产     │\n   └──────┬──────┘        └──────┬──────┘\n          │                       │\n   ┌──────┴──────┐        ┌──────┴──────┐\n   │ 高端自研     │        │ 战略合作     │\n   │ 低端外采     │        │ (深度绑定)   │\n   │             │        │             │\n   │ 小鹏(图灵)  │        │ 理想+德赛    │\n   │ 蔚来(神玑)  │        │ 问界+华为    │\n   │ 吉利(亿咖通)│        │ 长城+毫末    │\n   └─────────────┘        └─────────────┘\n```\n\n\n\n### 3.2 Detailed procurement relationship between various OEMs\n\n| OEM | Intelligent driving domain control supplier | Cockpit domain control supplier | Chip selection | Strategy |\n|--------|--------------|--------------|---------|------|\n| **BYD** | Self-developed (Eye of the God) | Self-developed + Desay SV | Self-developed + Horizon J6 | Full stack self-developed, low-end external procurement |\n| **Tesla** | Self-developed (FSD) | Pegatron/Quanta OEM | Self-developed FSD chip | Purely self-developed |\n| **Huawei Series** (Ask the World/Xiangjie/Zhijie) | Huawei ADS | Huawei Cockpit | Ascend 610+ Kirin | Huawei Full Stack Solution |\n| **Ideal** | Desay SV + self-developed (Schumacher) | Desay SV | Orin-X → self-developed | Deeply bound to Desay, high-end self-developed |\n| **Xpeng** | Self-developed (Turing chip) + Jingwei Hengrun (low-end) | Desay SV | Self-developed Turing + Orin | High-end self-developed, low-end outsourced |\n| **NIO** | Self-developed (Shenji NX9031) + Momenta | Desay SV | Self-developed (1000+TOPS) | ET9 self-developed, low-end outsourced |\n| **Xiaomi** | Self-researched | — | Orin-X | Mainly self-researched |\n| **Geely** | Yikatong + Desay SV + Horizon | Yikatong + Desay SV | Qualcomm 8295+ Core Power | Diversified supply |\n| **Great Wall** | Haomo Zhixing + Yuanrong Qixing + DJI Zhuoyu | Desay SV | Orin + Horizon J5 | Multi-supplier competition |\n| **GAC** | Desay SV | Desay SV | Orin-X | Mainly external procurement |\n| **Chang'an** | Huawei (Avita) + self-developed (Dark Blue) | — | Shengteng + Orin | Dual parallel lines |\n| **Chery** | Desay SV + Horizon | Desay SV | Orin+ Journey 5 | Mainly external procurement |\n| **SAIC** | Desay SV + Momenta | — | Orin | Outsourcing + strategic investment |\n\n### 3.3 Desay SV customer territory\n\nDesay SV is currently the domain control supplier with the widest fixed-point coverage, with customers from more than 80 OEMs:\n\n\n\n```\n德赛西威域控定点客户:\n\n自主品牌: 理想 | 小鹏 | 蔚来 | 小米 | 比亚迪 | 吉利 | 奇瑞 | 长城 | 广汽 | 长安 | 上汽\n合资品牌: 广汽丰田 | 东风日产 | 上汽通用\n海外品牌: 丰田 | 大众\n\n关键产品:\n├── IPU04 (Orin-X) → 理想/上汽/广汽/长城 智驾域控\n├── IPU14 (Thor)   → 广汽昊铂L4 (2025年量产)\n├── 第四代座舱域控  → 理想/吉利/广汽埃安/集度\n└── 中央计算平台    → 多家定点中\n```\n\n\n\n## 4. Industry trends and forecasts\n\n### 4.1 Market Size\n\n| Forecasting Agency | 2025 | 2030 |\n|---------|--------|--------|\n| McKinsey (Global) | US$128 billion | US$156 billion |\n| Guosheng Securities (China) | 167.5 billion yuan | 375.9 billion yuan |\n| Among them: smart cockpit domain control | 34.9 billion yuan | 40.4 billion yuan |\n| Among them: autonomous driving domain control | 87.1 billion yuan | 160.3 billion yuan |\n\n### 4.2 Key Trends\n\n1. **Self-research and outsourcing coexist**: Horizon founder Yu Kai judged that **20% of car companies choose self-research, and 80% still choose third-party cooperation**\n2. **Accelerating domestic substitution**: Among the top ten suppliers of cockpit domain control, seven are domestically produced (52.7%); the top 3 smart driving domain control suppliers are all local companies (66.2%)\n3. **Cabin-driving integration**: Single domain control → The trend of central computing platform is clear, Desay SV IPU14 (Thor) takes the lead in mass production\n4. **Smart driving sinks**: In January 2026, the smart driving domain control assembly rate has reached 28.7%, the monthly penetration rate has exceeded 30% for the first time, and the NOA function has dropped from 200,000+ to 100,000 levels.\n5. **Chip localization**: Qualcomm’s cockpit share dropped from 75.9% to 72.1%, and the total of Xinqing/Huawei/Xinchi increased to ~15%\n\n### 4.3 Prediction of competitive landscape (second half of 2026)\n\n| Field | First Echelon | Second Echelon | Potential Stocks |\n|------|---------|---------|--------|\n| Cockpit domain control supplier | Desay SV (~15%) | Bosch/Huawei/Yikatong (7-9%) | Honeycomb Electronics/Meijia Technology |\n| Intelligent driving domain control supplier | BYD/Huawei/Desay SV | Xiaomi/Jingwei Hengrun | Momenta/Zhixing Technology |\n| Cockpit chip | Qualcomm (~70%) | Huawei/Xinqing (~13%) | Xinchi/MediaTek |\n| Smart Driving Chip | Nvidia (~55%) | Huawei Ascend/Horizon (~20%) | Black Sesame/Houmo Smart |\n\n---\n\n## Data source\n\n- [Ranking of installed capacity of smart cockpit suppliers from January to April 2025 - Gasgoo Research Institute](https://i.gasgoo.com/news/70426903.html)\n- [Ranking of ADAS supplier installed capacity from January to April 2025 — Zhihu](https://zhuanlan.zhihu.com/p/1916865943386173711)\n- [In January 2026, the smart driving domain control assembly rate was 28.7%, and TOP3 suppliers accounted for 50% — Zuosi Auto Research] (https://zhuanlan.zhihu.com/p/2025169444607987990)\n- [Ranking of installed capacity of smart cockpit suppliers from January to February 2026 - Gasgoo Research Institute](https://i.gasgoo.com/news/70452902.html)\n- [Cockpit domain control welcomes a new round of reshuffle in January 2026 - Huashengtong](https://www.hstong.com/news/detail/26032616453526381)\n- [Smart Cockpit \"Brain\" No.1 Sprints into Hong Kong Stock Market - Qubit](https://www.qbitai.com/2026/04/400567.html)\n- [A summary of smart driving plans of car companies for equal rights in smart driving — Zhihu](https://zhuanlan.zhihu.com/p/1894467105199457266)\n- [Ranking of installed capacity of smart cockpit suppliers from January to November 2025 - Gasgoo Research Institute](https://i.gasgoo.com/news/70442273.html)\n- [2025 cockpit domain control list: Xinqing Technology leads domestic chips — Zhihu](https://zhuanlan.zhihu.com/p/2012109951158477835)\n- [Intelligent assisted driving domain control research: monthly penetration rate exceeds 30% for the first time — Zhihu](https://zhuanlan.zhihu.com/p/1963616929592906089)\n"</script>
