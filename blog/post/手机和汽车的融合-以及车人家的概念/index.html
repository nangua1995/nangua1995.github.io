<script type="application/json" id="sourceZh">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/10/23/%e6%89%8b%e6%9c%ba%e5%92%8c%e6%b1%bd%e8%bd%a6%e7%9a%84%e8%9e%8d%e5%90%88-%e4%bb%a5%e5%8f%8a%e8%bd%a6%e4%ba%ba%e5%ae%b6%e7%9a%84%e6%a6%82%e5%bf%b5/)\n\n<p>一些行业资料：<\/p>\n\n\n\n<p><strong>2024年10月23日，深圳——<\/strong>OPPO与比亚迪宣布签订战略合作协议，双方将共同推进<a>手机<\/a>与汽车的互融合作，这一合作也标志着两大行业巨头在技术创新和产业融合上迈出了重要一步，为手机与汽车的深度融合探索新的可能。双方的首个落地产品“手车互联”将通过OTA在腾势Z9GT和<a>OPPO Find X<\/a>8系列上搭载落地。比亚迪与OPPO的联合将推动手机和车机在多种用车场景下的深度融合，双方将致力于在智能座舱平台的硬件模组、软件系统、智能算法等领域进行联合研发，包括AI融合座舱、健康座舱、数字车钥匙、车管家、融合桌面、多媒体服务共享和算力共享等创新技术，共同打造智能化用车体验，引领产业发展进入新阶段。<\/p>\n\n\n\n<figure class=\"wp-block-image size-large\"><img decoding=\"async\" loading=\"lazy\" width=\"1024\" height=\"254\" src=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-1024x254.png\" alt=\"\" class=\"wp-image-813\" srcset=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-1024x254.png 1024w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-300x75.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-768x191.png 768w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-1536x382.png 1536w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-45-2048x509.png 2048w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /><\/figure>\n\n\n\n<p>oppo 和理想： https://www.sohu.com/a/701335590_269964<\/p>\n\n\n\n<p>小米车手互联<\/p>\n\n\n\n<figure class=\"wp-block-image size-large\"><img decoding=\"async\" loading=\"lazy\" width=\"1024\" height=\"572\" src=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-46-1024x572.png\" alt=\"\" class=\"wp-image-814\" srcset=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-46-1024x572.png 1024w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-46-300x168.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-46-768x429.png 768w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-46-1536x858.png 1536w, https://zhinengzuocan uocang.cn/wp-content/uploads/2024/10/image-54-300x183.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-54-768x469.png 768w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-54-1536x938.png 1536w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-54.png 1969w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /><\/figure>\n\n\n\n<p>理想 <\/p>\n\n\n\n<p><\/p>\n\n\n\n<p>蔚来 &amp; 手机<\/p>\n\n\n\n<p><\/p>\n\n\n\n<p>小鹏 <\/p>\n\n\n\n<p><\/p>\n\n\n\n<p>手机厂：<\/p>\n\n\n\n<p><\/p>\n\n\n\n<p>vivo  作为手机厂，主推的是自己的jovi inCar，最新大版本是4.0，23年底有消息大众汽车集团旗下软件公司CARIAD的中国子公司（“CARIAD中国”）宣布与vivo成立“手车互融联合创新实验室”（英文名：Mobile &amp; Mobility Fusion Joint Innovative Lab，简称M²实验室）。双方合作将以CARIAD中国本土创新研发中心“元创实验室”（英文名：Forward! Lab）为平台，聚焦智能互联汽车的相关软硬件、远程信息服务平台与智能出行服务。<\/p>\n\n\n\n<figure class=\"wp-block-image size-large\"><img decoding=\"async\" loading=\"lazy\" width=\"1024\" height=\"943\" src=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-55-1024x943.png\" alt=\"\" class=\"wp-image-831\" srcset=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-55-1024x943.png 1024w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-55-300x276.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-55-768x707.png 768w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-55.png 1444w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /><\/figure>\n\n\n\n<p>相关介绍资料：https://club.autohome.com.cn/bbs/thread/65d34ffc74400870/106906536-1.html<\/p>\n\n\n\n<p><a href=\"https://www.leiphone.com/category/weiwu/cG12fFDSZoms0uhb.html\">https://www.leiphone.com/category/weiwu/cG12fFDSZoms0uhb.html<\/a><\/p>\n"</script>
