            <td>2<\/td>\n                        <td>\n                            <input type=\"text\" id=\"result2\" readonly>\n                            <div class=\"binary-options\">\n                                <label><input type=\"checkbox\" id=\"padZero\"> 补0至<\/label>\n                                <select id=\"padBits\">\n                                    <option value=\"8\">8位<\/option>\n                                    <option value=\"16\">16位<\/option>\n                                    <option value=\"32\" selected>32位<\/option>\n                                    <option value=\"64\">64位<\/option>\n                                <\/select>\n                                <label><input type=\"radio\" name=\"endian\" value=\"big\" checked> 大端序<\/label>\n                                <label><input type=\"radio\" name=\"endian\" value=\"little\"> 小端序<\/label>\n                            <\/div>\n                        <\/td>\n                        <td class=\"explanation\"><\/td>\n                    <\/tr>\n                    <tr>\n                        <td>8<\/td>\n                        <td><input type=\"text\" id=\"result8\" readonly><\/td>\n                        <td class=\"explanation\"><\/td>\n                    <\/tr>\n                    <tr>\n                        <td>10<\/td>\n                        <td><input type=\"text\" id=\"result10\" readonly><\/td>\n                        <td class=\"explanation\"><\/td>\n                    <\/tr>\n                    <tr>\n                        <td>16<\/td>\n                        <td><input type=\"text\" id=\"result16\" readonly><\/td>\n                        <td class=\"explanation\"><\/td>\n                    <\/tr>\n                    <tr>\n                        <td>26<\/td>\n                        <td><input type=\"text\" id=\"result26\" readonly><\/td>\n                        <td class=\"explanation\">小写字母<\/td>\n                    <\/tr>\n                    <tr>\n                        <td>32<\/td>\n                        <td><input type=\"text\" id=\"result32\" readonly><\/td>\n                        <td class=\"explanation\">数字 + 大写字母，不包含 ILOU 字符<\/td>\n                    <\/tr>\n                    <tr>\n                        <td>36<\/td>\n                        <td><input type=\"text\" id=\"result36\" readonly><\/td>\n                        <td class=\"explanation\">数字 + 小写字母<\/td>\n                    <\/tr>\n                    <tr>\n                        <td>52<\/td>\n                        <td><input type=\"text\" id=\"result52\" readonly><\/td>\n                        <td class=\"explanation\">大小写字母<\/td>\n                    <\/tr>\n                    <tr>\n                        <td>58<\/td>\n                        <td><input type=\"text\" id=\"result58\" readonly><\/td>\n                        <td class=\"explanation\">数字 + 大小写字母，不包含 0OIl 字符<\/td>\n                    <\/tr>\n                    <tr>\n                        <td>62<\/td>\n                        <td><input type=\"text\" id=\"result62\" readonly><\/td>\n                        <td class=\"explanation\">数字 + 大小写字母<\/td>\n                    <\/tr>\n                <\/tbody>\n            <\/table>\n        <\/div>\n    <\/div>\n    \n    <script>\n        // 字符集定义\n        const charSets = {\n            26: 'abcdefghijklmnopqrstuvwxyz',\n            32: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', // 不包含 ILOU\n            36: '0123456789abcdefghijklmnopqrstuvwxyz',\n            52: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',\n            58: '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz', // 不包含 0OIl\n            62: '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'\n        };\n        \n        // 初始化\n        function init() {\n            // 绑定事件\n            document.getElementById('customBase').addEventListener('change', function() {\n                const base = this.value;\n                document.querySelectorAll('input[name=\"inputBase\"]').forEach(radio => {\n                    radio.checked = radio.value === base;\n                });\n            });\n            \n            // 初始转换\n            convert();\n        }\n        \n        // 转换函数\n        function convert() {\n            const inputValue = document.getElementById('inputValue').value.trim();\n            if (!inputValue) {\n                alert('请输入数值');\n                return;\n            }\n            \n            // 获取输入进制\n            const inputBase = parseInt(document.querySelector('input[name=\"inputBase\"]:checked').value);\n            \n            // 转换为十进制\n            let decimalValue;\n            try {\n                decimalValue = parseInt(inputValue, inputBase);\n                if (isNaN(decimalValue)) {\n                    throw new Error('无效的输入值');\n                }\n            } catch (error) {\n                alert('输入值与所选进制不匹配');\n                return;\n            }\n            \n            // 转换到各个进制\n            convertToBase(decimalValue, 2, 'result2');\n            convertToBase(decimalValue, 8, 'result8');\n            convertToBase(decimalValue, 10, 'result10');\n            convertToBase(decimalValue, 16, 'result16');\n            convertToBase(decimalValue, 26, 'result26', charSets[26]);\n            convertToBase(decimalValue, 32, 'result32', charSets[32]);\n            convertToBase(decimalValue, 36, 'result36', charSets[36]);\n            convertToBase(decimalValue, 52, 'result52', charSets[52]);\n            convertToBase(decimalValue, 58, 'result58', charSets[58]);\n            convertToBase(decimalValue, 62, 'result62', charSets[62]);\n        }\n        \n        // 转换到指定进制\n        function convertToBase(value, base, resultId, charSet = null) {\n            let result;\n            \n            if (charSet) {\n                // 使用自定义字符集\n                result = convertWithCharSet(value, charSet);\n            } else {\n                // 使用内置转换\n                result = value.toString(base);\n                // 16进制大写\n                if (base === 16) {\n                    result = result.toUpperCase();\n                }\n            }\n            \n            // 二进制特殊处理\n            if (base === 2) {\n                const padZero = document.getElementById('padZero').checked;\n                if (padZero) {\n                    const padBits = parseInt(document.getElementById('padBits').value);\n                    const endian = document.querySelector('input[name=\"endian\"]:checked').value;\n                    \n                    // 补零\n                    while (result.length < padBits) {\n                        result = '0' + result;\n                    }\n                    \n                    // 小端序处理\n                    if (endian === 'little') {\n                        result = reverseBits(result, 8); // 按字节反转\n                    }\n                }\n            }\n            \n            // 显示结果\n            document.getElementById(resultId).value = result;\n        }\n        \n        // 使用自定义字符集转换\n        function convertWithCharSet(value, charSet) {\n            if (value === 0) return charSet[0];\n            \n            const base = charSet.length;\n            let result = '';\n            let num = value;\n            \n            while (num > 0) {\n                const remainder = num % base;\n                result = charSet[remainder] + result;\n                num = Math.floor(num / base);\n            }\n            \n            return result;\n        }\n        \n        // 按字节反转二进制字符串\n        function reverseBits(binString, byteSize) {\n            // 确保长度是字节的倍数\n            while (binString.length % byteSize !== 0) {\n                binString = '0' + binString;\n            }\n            \n            // 按字节分割\n            const bytes = [];\n            for (let i = 0; i < binString.length; i += byteSize) {\n                bytes.push(binString.substring(i, i + byteSize));\n            }\n            \n            // 反转字节顺序\n            bytes.reverse();\n            \n            // 重新组合\n            return bytes.join('');\n        }\n        \n        // 初始化\n        init();\n    <\/script>\n<\/body>\n<\/html>\n"</script>

 else {\n                // 使用内置转换\n                result = value.toString(base);\n                // 16进制大写\n                if (base === 16) {\n                    result = result.toUpperCase();\n                }\n            }\n            \n            // 二进制特殊处理\n            if (base === 2) {\n                const padZero = document.getElementById('padZero').checked;\n                if (padZero) {\n                    const padBits = parseInt(document.getElementById('padBits').value);\n                    const endian = document.querySelector('input[name=\"endian\"]:checked').value;\n                    \n                    // 补零\n                    while (result.length < padBits) {\n                        result = '0' + result;\n                    }\n                    \n                    // 小端序处理\n                    if (endian === 'little') {\n                        result = reverseBits(result, 8); // 按字节反转\n                    }\n                }\n            }\n            \n            // 显示结果\n            document.getElementById(resultId).value = result;\n        }\n        \n        // 使用自定义字符集转换\n        function convertWithCharSet(value, charSet) {\n            if (value === 0) return charSet[0];\n            \n            const base = charSet.length;\n            let result = '';\n            let num = value;\n            \n            while (num > 0) {\n                const remainder = num % base;\n                result = charSet[remainder] + result;\n                num = Math.floor(num / base);\n            }\n            \n            return result;\n        }\n        \n        // 按字节反转二进制字符串\n        function reverseBits(binString, byteSize) {\n            // 确保长度是字节的倍数\n            while (binString.length % byteSize !== 0) {\n                binString = '0' + binString;\n            }\n            \n            // 按字节分割\n            const bytes = [];\n            for (let i = 0; i < binString.length; i += byteSize) {\n                bytes.push(binString.substring(i, i + byteSize));\n            }\n            \n            // 反转字节顺序\n            bytes.reverse();\n            \n            // 重新组合\n            return bytes.join('');\n        }\n        \n        // 初始化\n        init();\n    <\/script>\n<\/body>\n<\/html>\n"</script>
