<h1 data-zh="Android SystemUI 启动流程" data-en="Android SystemUI 启动流程">Android SystemUI 启动流程</h1>
<p class="summary" data-zh="SystemServer中启动 SystemServer启动后，会在Main Thread启动Activity […]" data-en="SystemServer中启动 SystemServer启动后，会在Main Thread启动Activity […]">SystemServer中启动 SystemServer启动后，会在Main Thread启动Activity […]</p>
<p class="tags" data-zh="" data-en=""></p>
<div id="content" class="markdown"></div>
<script type="application/json" id="sourceZh">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/04/17/android-systemui-%e5%90%af%e5%8a%a8%e6%b5%81%e7%a8%8b/)\n\n<h3 class=\"wp-block-heading\">SystemServer中启动<\/h3>\n\n\n\n<p>SystemServer启动后，会在Main Thread启动ActivityManagerService，当ActivityManagerService systemReady后，会去启动SystemUIService。<\/p>\n\n\n\n<p><em>/frameworks/base/services/java/com/android/server/SystemServer.java<\/em><\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①main\n    /**\n     * The main entry point from zygote.\n     */\n    public static void main(String&#91;] args) {\n        new SystemServer().run();\n    }\n②run\n    private void run() {\n        t.traceBegin(\"InitBeforeStartServices\");\n        ....\n       // Create the system service manager.\n            mSystemServiceManager = new SystemServiceManager(mSystemContext);\n            mSystemServiceManager.setStartInfo(mRuntimeRestart,\n                    mRuntimeStartElapsedTime, mRuntimeStartUptime);\n            LocalServices.addService(SystemServiceManager.class, mSystemServiceManager);\n        ....\n       }\n③mActivityManagerService.systemReady\nmActivityManagerService.systemReady(() -&gt; {\n    //准备好服务\n    Slog.i(TAG, \"Making services ready\");\n    ....\n            //跟踪开启系统界面\n            t.traceBegin(\"StartSystemUI\");\n            try {\n                //开启系统界面\n                startSystemUi(context, windowManagerF);\n            } catch (Throwable e) {\n                reportWtf(\"starting System UI\", e);\n            }\n            t.traceEnd();\n    ....\n}\n④startSystemUi\n    private static void startSystemUi(Context context, WindowManagerService windowManager) {\n        PackageManagerInternal pm = LocalServices.getService(PackageManagerInternal.class);\n        Intent intent = new Intent();\n        intent.setComponent(pm.getSystemUiServiceComponent());\n        intent.addFlags(Intent.FLAG_DEBUG_TRIAGED_MISSING);\n        //Slog.d(TAG, \"Starting service: \" + intent);\n        //通过startServiceAsUser，SystemUIService就启动了，即SystemUI进程开机启动\n        context.startServiceAsUser(intent, UserHandle.SYSTEM);\n        windowManager.onSystemUiStarted();\n    }<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">SystemUIService<\/h3>\n\n\n\n<p>在SystemUIService的onCreate方法中会调用SystemUIApplication的<strong>startServicesIfNeeded<\/strong>方法，这个方法会调用&nbsp;<strong>startServicesIfNeeded<\/strong>(SERVICES)方法启动一系列服务.<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>@Override\n    public void onCreate() {\n        super.onCreate();\n        // Start all of SystemUI\n        ((SystemUIApplication) getApplication()).startServicesIfNeeded();\n  }<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">SystemUIApplication<\/h3>\n\n\n\n<p><em>/frameworks/base/packages/SystemUI/src/com/android/systemui/SystemUIApplication.java<\/em><\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①startServicesIfNeeded()\npublic void startServicesIfNeeded() {\n    //获取所有的服务的路径，所有SERVICES统一继承了SystemUI类：\n    String&#91;] names = SystemUIFactory.getInstance().getSystemUIServiceComponents(getResources());\n    startServicesIfNeeded(/* metricsPrefix= */ \"StartServices\", names);\n}\n②startServicesIfNeeded(String metricsPrefix, String&#91;] services)\n在重载方法中将每一个名称通过反射来得到实例对象,然后依次调用每一个SystemUI的子类的start方法启动每一个模块。\n\nprivate void startServicesIfNeeded(String metricsPrefix, String&#91;] services) {\n    if (mServicesStarted) {\n        return;\n    }\n    mServices = new SystemUI&#91;services.length];\n\n    //检查一下，也许在我们开始之前很久它就已经完成了\n    if (!mBootCompleteCache.isBootComplete()) {\n        // check to see if maybe it was already completed long before we began\n        // see ActivityManagerService.finishBooting()\n        if (\"1\".equals(SystemProperties.get(\"sys.boot_completed\"))) {\n            mBootCompleteCache.setBootComplete();\n            if (DEBUG) {\n                Log.v(TAG, \"BOOT_COMPLETED was already sent\");\n            }\n        }\n    }\n\n    final DumpManager dumpManager = mRootComponent.createDumpManager();\n\n    Log.v(TAG, \"Starting SystemUI services for user \" +\n            Process.myUserHandle().getIdentifier() + \".\");\n    TimingsTraceLog log = new TimingsTraceLog(\"SystemUIBootTiming\",\n            Trace.TRACE_TAG_APP);\n    //开始追踪\n    log.traceBegin(metricsPrefix);\n    final int N = services.length;\n    //遍历services这个数组\n    for (int i = 0; i &lt; N; i++) {\n        String clsName = services&#91;i];\n        if (DEBUG) Log.d(TAG, \"loading: \" + clsName);\n        log.traceBegin(metricsPrefix + clsName);\n        long ti = System.currentTimeMillis();\n        try {\n            SystemUI obj = mComponentHelper.resolveSystemUI(clsName);\n            if (obj == null) {\n                Constructor constructor = Class.forName(clsName).getConstructor(Context.class);\n                obj = (SystemUI) constructor.newInstance(this);\n            }\n            mServices&#91;i] = obj;\n        } catch (ClassNotFoundException\n                | NoSuchMethodException\n                | IllegalAccessException\n                | InstantiationException\n                | InvocationTargetException ex) {\n            throw new RuntimeException(ex);\n        }\n\n        if (DEBUG) Log.d(TAG, \"running: \" + mServices&#91;i]);\n        //依次调用service的start方法启动服务\n        mServices&#91;i].start();\n        log.traceEnd();\n\n        // Warn if initialization of component takes too long\n        //如果组件初始化时间过长，则发出警告\n        ti = System.currentTimeMillis() - ti;\n        if (ti &gt; 1000) {\n            Log.w(TAG, \"Initialization of \" + clsName + \" took \" + ti + \" ms\");\n        }\n        if (mBootCompleteCache.isBootComplete()) {\n            mServices&#91;i].onBootCompleted();\n        }\n\n        dumpManager.registerDumpable(mServices&#91;i].getClass().getName(), mServices&#91;i]);\n    }\n    mRootComponent.getInitController().executePostInitTasks();\n    //结束追踪\n    log.traceEnd();\n\n    mServicesStarted = true;\n}<\/code><\/pre>\n\n\n\n<h2 class=\"wp-block-heading\">状态栏<\/h2>\n\n\n\n<h3 class=\"wp-block-heading\">StatusBar.start()<\/h3>\n\n\n\n<pre class=\"wp-block-code\"><code>①createAndAddWindows\n    public void createAndAddWindows(@Nullable RegisterStatusBarResult result) {\n        //创建状态栏\n        makeStatusBarView(result);\n        mNotificationShadeWindowController.attach();\n        //创建状态栏的窗口\n        mStatusBarWindowController.attach();\n    }\n②makeStatusBarView\nprotected void makeStatusBarView(@Nullable RegisterStatusBarResult result) {\n    final Context context = mContext;\n    .....\n    FragmentHostManager.get(mPhoneStatusBarWindow)\n            .addTagListener(CollapsedStatusBarFragment.TAG, (tag, fragment) -&gt; {\n                //CollapsedStatusBarFragment 替换 status_bar_container(状态栏通知显示区域)\n                CollapsedStatusBarFragment statusBarFragment =\n                        (CollapsedStatusBarFragment) fragment;\n\n                PhoneStatusBarView oldStatusBarView = mStatusBarView;\n                mStatusBarView = (PhoneStatusBarView) statusBarFragment.getView();\n                //传递statusBar处理下拉事件\n                mStatusBarView.setBar(this);\n                //传递 NotificationPanelView 显示下拉UI控制\n                mStatusBarView.setPanel(mNotificationPanelViewController);\n                mStatusBarView.setScrimController(mScrimController);\n                //初始化通知栏区域\n                statusBarFragment.initNotificationIconArea(mNotificationIconAreaController);\n                ......\n                    \n            }).getFragmentManager()\n            .beginTransaction()\n            .replace(R.id.status_bar_container, new CollapsedStatusBarFragment(),\n                    CollapsedStatusBarFragment.TAG)\n            .commit();\n    .....<\/code><\/pre>\n\n\n\n<p>CollapsedStatusBarFragment<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①createAndAddWindows\n    public void createAndAddWindows(@Nullable RegisterStatusBarResult result) {\n        //创建状态栏\n        makeStatusBarView(result);\n        mNotificationShadeWindowController.attach();\n        //创建状态栏的窗口\n        mStatusBarWindowController.attach();\n    }\n②makeStatusBarView\nprotected void makeStatusBarView(@Nullable RegisterStatusBarResult result) {\n    final Context context = mContext;\n    .....\n    FragmentHostManager.get(mPhoneStatusBarWindow)\n            .addTagListener(CollapsedStatusBarFragment.TAG, (tag, fragment) -> {\n                //CollapsedStatusBarFragment 替换 status_bar_container(状态栏通知显示区域)\n                CollapsedStatusBarFragment statusBarFragment =\n                        (CollapsedStatusBarFragment) fragment;\n\n                PhoneStatusBarView oldStatusBarView = mStatusBarView;\n                mStatusBarView = (PhoneStatusBarView) statusBarFragment.getView();\n                //传递statusBar处理下拉事件\n                mStatusBarView.setBar(this);\n                //传递 NotificationPanelView 显示下拉UI控制\n                mStatusBarView.setPanel(mNotificationPanelViewController);\n                mStatusBarView.setScrimController(mScrimController);\n                //初始化通知栏区域\n                statusBarFragment.initNotificationIconArea(mNotificationIconAreaController);\n                ......\n                    \n            }).getFragmentManager()\n            .beginTransaction()\n            .replace(R.id.status_bar_container, new CollapsedStatusBarFragment(),\n                    CollapsedStatusBarFragment.TAG)\n            .commit();\n    .....\n2、CollapsedStatusBarFragment\n①onCreateView\n    @Override\n    public View onCreateView(LayoutInflater inflater, @Nullable ViewGroup container,\n            Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.status_bar, container, false);\n    }\n②initNotificationIconArea\npublic void initNotificationIconArea(NotificationIconAreaController\n        notificationIconAreaController) {\n    //notification_icon_area是在status_bar.xml的布局，它是属于通知Notification    \n    //获取到 notification_icon_area，FrameLayout转为ViewGroup，\n    ViewGroup notificationIconArea = mStatusBar.findViewById(R.id.notification_icon_area);\n    //调用 notificationIconAreaController 获取通知要显示的view(LinearLayout)\n    //在4中跟进\n    mNotificationIconAreaInner =\n            notificationIconAreaController.getNotificationInnerAreaView();\n    //如果已经有显示的view，通过 view 父布局将其自身remove，然后再重新addView。\n    //最后将 mNotificationIconAreaInner 显示出来(设置透明度为1，visibility为VISIBLE)\n    if (mNotificationIconAreaInner.getParent() != null) {\n        ((ViewGroup) mNotificationIconAreaInner.getParent())\n                .removeView(mNotificationIconAreaInner);\n    }\n    notificationIconArea.addView(mNotificationIconAreaInner);\n\n    //与上面一样\n    ViewGroup statusBarCenteredIconArea = mStatusBar.findViewById(R.id.centered_icon_area);\n    mCenteredIconArea = notificationIconAreaController.getCenteredNotificationAreaView();\n    if (mCenteredIconArea.getParent() != null) {\n        ((ViewGroup) mCenteredIconArea.getParent())\n                .removeView(mCenteredIconArea);\n    }\n    statusBarCenteredIconArea.addView(mCenteredIconArea);\n\n    //默认为显示，直到我们知道其他情况\n    // Default to showing until we know otherwise.\n    showNotificationIconArea(false);\n}\n③showNotificationIconArea\n当状态栏下拉时，状态栏中的图标icon会慢慢的变成透明和不可见，就是通过hideSystemIconArea(true), hideNotificationIconArea(true）\n\n//当状态栏下拉时，设置状态栏中的图标icon会慢慢的变成透明和不可见    \npublic void hideNotificationIconArea(boolean animate) {\n        animateHide(mNotificationIconAreaInner, animate);\n        animateHide(mCenteredIconArea, animate);\n    }\n//设置状态栏图标透明度为1，visibility为VISIBLE\n    public void showNotificationIconArea(boolean animate) {\n        animateShow(mNotificationIconAreaInner, animate);\n        animateShow(mCenteredIconArea, animate);\n    }\n\n    public void hideOperatorName(boolean animate) {\n        if (mOperatorNameFrame != null) {\n            animateHide(mOperatorNameFrame, animate);\n        }\n    }\n\n    public void showOperatorName(boolean animate) {\n        if (mOperatorNameFrame != null) {\n            animateShow(mOperatorNameFrame, animate);\n        }\n④animateShow\n    private void animateShow(View v, boolean animate) {\n        v.animate().cancel();\n        //(设置透明度为1，visibility为VISIBLE)\n        v.setVisibility(View.VISIBLE);\n        if (!animate) {\n            v.setAlpha(1f);\n            return;\n        }\n        .....\n    }\n⑤animateHiddenState\n//将视图动画化为 INVISIBLE 或 GONE    \nprivate void animateHiddenState(final View v, int state, boolean animate) {\n        v.animate().cancel();\n        if (!animate) {\n            v.setAlpha(0f);\n            v.setVisibility(state);\n            return;\n        }\n\n        v.animate()\n                .alpha(0f)\n                .setDuration(160)\n                .setStartDelay(0)\n                .setInterpolator(Interpolators.ALPHA_OUT)\n                .withEndAction(() -> v.setVisibility(state));\n    }<\/code><\/pre>\n\n\n\n<p>status_bar.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;?xml version=\"1.0\" encoding=\"utf-8\"?>\n&lt;!--\n**\n** Copyright 2006, The Android Open Source Project\n**\n** Licensed under the Apache License, Version 2.0 (the \"License\");\n** you may not use this file except in compliance with the License.\n** You may obtain a copy of the License at\n**\n**     http://www.apache.org/licenses/LICENSE-2.0\n**\n** Unless required by applicable law or agreed to in writing, software\n** distributed under the License is distributed on an \"AS IS\" BASIS,\n** WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n** See the License for the specific language governing permissions and\n** limitations under the License.\n*/\n-->\n\n&lt;!--    android:background=\"@drawable/status_bar_closed_default_background\" -->\n&lt;com.android.systemui.statusbar.phone.PhoneStatusBarView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:systemui=\"http://schemas.android.com/apk/res/com.android.systemui\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"@dimen/status_bar_height\"\n    android:id=\"@+id/status_bar\"\n    android:orientation=\"vertical\"\n    android:focusable=\"false\"\n    android:descendantFocusability=\"afterDescendants\"\n    android:accessibilityPaneTitle=\"@string/status_bar\"\n    >\n\n    &lt;!-- add for KGDAANWIKFRA-135 -->\n    &lt;View\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"@dimen/status_bar_height\"\n        android:id=\"@+id/status_bar_dark_view\"\n        android:background=\"#ff000000\"\n        android:visibility=\"gone\" />\n    //&lt;!--通知灯，默认gone-->\n    &lt;ImageView\n        android:id=\"@+id/notification_lights_out\"\n        android:layout_width=\"@dimen/status_bar_icon_size\"\n        android:layout_height=\"match_parent\"\n        android:paddingStart=\"@dimen/status_bar_padding_start\"\n        android:paddingBottom=\"2dip\"\n        android:src=\"@drawable/ic_sysbar_lights_out_dot_small\"\n        android:scaleType=\"center\"\n        android:visibility=\"gone\"\n        />\n    //&lt;!--状态栏内容-->\n    &lt;LinearLayout android:id=\"@+id/status_bar_contents\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\n        android:paddingStart=\"@dimen/status_bar_padding_start\"\n        android:paddingEnd=\"@dimen/status_bar_padding_end\"\n        android:paddingTop=\"@dimen/status_bar_padding_top\"\n        android:orientation=\"horizontal\"\n        >\n        &lt;FrameLayout\n            android:layout_height=\"match_parent\"\n            android:layout_width=\"0dp\"\n            android:layout_weight=\"1\">\n\n            &lt;include layout=\"@layout/heads_up_status_bar_layout\" />\n\n            &lt;!-- The alpha of the left side is controlled by PhoneStatusBarTransitions, and the\n             individual views are controlled by StatusBarManager disable flags DISABLE_CLOCK and\n             DISABLE_NOTIFICATION_ICONS, respectively -->\n            &lt;LinearLayout\n                android:id=\"@+id/status_bar_left_side\"\n                android:layout_height=\"match_parent\"\n                android:layout_width=\"match_parent\"\n                android:clipChildren=\"false\"\n            >\n                &lt;ViewStub\n                    android:id=\"@+id/operator_name\"\n                    android:layout_width=\"wrap_content\"\n                    android:layout_height=\"match_parent\"\n                    android:layout=\"@layout/operator_name\" />\n\n                &lt;com.android.systemui.statusbar.policy.Clock\n                    android:id=\"@+id/clock\"\n                    android:layout_width=\"wrap_content\"\n                    android:layout_height=\"match_parent\"\n                    android:textAppearance=\"@style/TextAppearance.StatusBar.Clock\"\n                    android:singleLine=\"true\"\n                    android:paddingStart=\"@dimen/status_bar_left_clock_starting_padding\"\n                    android:paddingEnd=\"@dimen/status_bar_left_clock_end_padding\"\n                    android:gravity=\"center_vertical|start\"\n                />\n\n                //&lt;!--通知图标区域-->\n                &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n                    android:id=\"@+id/notification_icon_area\"\n                    android:layout_width=\"0dp\"\n                    android:layout_height=\"match_parent\"\n                    android:layout_weight=\"1\"\n                    android:orientation=\"horizontal\"\n                    android:clipChildren=\"false\"/>\n\n            &lt;/LinearLayout>\n        &lt;/FrameLayout>\n\n        &lt;!-- Space should cover the notch (if it exists) and let other views lay out around it -->\n        &lt;android.widget.Space\n            android:id=\"@+id/cutout_space_view\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:gravity=\"center_horizontal|center_vertical\"\n        />\n\n        //居中的图标区域        \n        &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n            android:id=\"@+id/centered_icon_area\"\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"match_parent\"\n            android:orientation=\"horizontal\"\n            android:clipChildren=\"false\"\n            android:gravity=\"center_horizontal|center_vertical\"/>\n\n        &lt;com.android.keyguard.AlphaOptimizedLinearLayout android:id=\"@+id/system_icon_area\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:layout_weight=\"1\"\n            android:orientation=\"horizontal\"\n            android:gravity=\"center_vertical|end\"\n            >\n            //&lt;!--系统图标-->\n            &lt;include layout=\"@layout/system_icons\" />\n        &lt;/com.android.keyguard.AlphaOptimizedLinearLayout>\n    &lt;/LinearLayout>\n    //&lt;!--紧急密码管理员文本-->\n    &lt;ViewStub\n        android:id=\"@+id/emergency_cryptkeeper_text\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"match_parent\"\n        android:layout=\"@layout/emergency_cryptkeeper_text\"\n    />\n&lt;/com.android.systemui.statusbar.phone.PhoneStatusBarView><\/code><\/pre>\n\n\n\n<p>NotificationIconAreaController<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>getNotificationInnerAreaView\n    /**\n     * Returns the view that represents the notification area.+\n     * 返回表示通知区域的视图。\n     */\n    public View getNotificationInnerAreaView() {\n        return mNotificationIconArea;\n    }\ninitializeNotificationAreaViews\n/**\n * Initializes the views that will represent the notification area.\n * 初始化将表示通知区域的视图。\n */\nprotected void initializeNotificationAreaViews(Context context) {\n    reloadDimens(context);\n    \n    LayoutInflater layoutInflater = LayoutInflater.from(context);\n    //通知图标区域布局\n    mNotificationIconArea = inflateIconArea(layoutInflater);\n    //通知图标\n    mNotificationIcons = mNotificationIconArea.findViewById(R.id.notificationIcons);\n    //获取通知滚动布局\n    mNotificationScrollLayout = mStatusBar.getNotificationScrollLayout();\n    //中心图标区域布局\n    mCenteredIconArea = layoutInflater.inflate(R.layout.center_icon_area, null);\n    //居中的图标\n    mCenteredIcon = mCenteredIconArea.findViewById(R.id.centeredIcon);\n\n    initAodIcons();\n}\ninflateIconArea\n\n    protected View inflateIconArea(LayoutInflater inflater) {\n        return inflater.inflate(R.layout.notification_icon_area, null);\n    }<\/code><\/pre>\n\n\n\n<p>status icon加载流程<\/p>\n\n\n\n<p>1、 status_bar.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n            android:id=\"@+id/centered_icon_area\"\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"match_parent\"\n            android:orientation=\"horizontal\"\n            android:clipChildren=\"false\"\n            android:gravity=\"center_horizontal|center_vertical\"/>\n\n        &lt;com.android.keyguard.AlphaOptimizedLinearLayout android:id=\"@+id/system_icon_area\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:layout_weight=\"1\"\n            android:orientation=\"horizontal\"\n            android:gravity=\"center_vertical|end\"\n            >\n            &lt;!--系统图标-->\n            &lt;include layout=\"@layout/system_icons\" />\n        &lt;/com.android.keyguard.AlphaOptimizedLinearLayout><\/code><\/pre>\n\n\n\n<p>2、system_icons.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n              xmlns:systemui=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/system_icons\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\n    android:gravity=\"center_vertical\">\n    //StatusIconContainer继承AlphaOptimizedLinearLayout\n    &lt;com.android.systemui.statusbar.phone.StatusIconContainer android:id=\"@+id/statusIcons\"\n        android:layout_width=\"0dp\"\n        android:layout_weight=\"1\"\n        android:layout_height=\"match_parent\"\n        android:paddingEnd=\"@dimen/signal_cluster_battery_padding\"\n        android:gravity=\"center_vertical\"\n        android:orientation=\"horizontal\"/>\n\n    &lt;com.android.systemui.BatteryMeterView android:id=\"@+id/battery\"\n        android:layout_height=\"match_parent\"\n        android:layout_width=\"wrap_content\"\n        android:clipToPadding=\"false\"\n        android:clipChildren=\"false\"\n        systemui:textAppearance=\"@style/TextAppearance.StatusBar.Clock\" />\n&lt;/LinearLayout><\/code><\/pre>\n\n\n\n<p>3、AlphaOptimizedLinearLayout<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> //该方法用来标记当前view是否存在过度绘制，存在返回ture，不存在返回false，\n    //api里面默认返回为true，status icon不存在过度绘制。\n    @Override\n    public boolean hasOverlappingRendering() {\n        return false;\n    }<\/code><\/pre>\n\n\n\n<p>4、CollapsedStatusBarFragment<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> @Override\n    public void onViewCreated(View view, @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n        mStatusBar = (PhoneStatusBarView) view;\n        if (savedInstanceState != null &amp;&amp; savedInstanceState.containsKey(EXTRA_PANEL_STATE)) {\n            mStatusBar.restoreHierarchyState(\n                    savedInstanceState.getSparseParcelableArray(EXTRA_PANEL_STATE));\n        }\n......\n    }<\/code><\/pre>\n\n\n\n<p>5、StatusBarIconController<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①DarkIconManager\n    /**\n     * Version of ViewGroup that observes state from the DarkIconDispatcher.\n     */\n    public static class DarkIconManager extends IconManager {\n        private final DarkIconDispatcher mDarkIconDispatcher;\n        private int mIconHPadding;\n\n        public DarkIconManager(LinearLayout linearLayout, CommandQueue commandQueue) {\n            super(linearLayout, commandQueue);\n            mIconHPadding = mContext.getResources().getDimensionPixelSize(\n                    R.dimen.status_bar_icon_padding);\n            mDarkIconDispatcher = Dependency.get(DarkIconDispatcher.class);\n        }\n        //每个icon应该就是对应着代表顺序的index和数据类型为String的slot\n        @Override\n        protected void onIconAdded(int index, String slot, boolean blocked,\n                StatusBarIconHolder holder) {\n            StatusIconDisplayable view = addHolder(index, slot, blocked, holder);\n            mDarkIconDispatcher.addDarkReceiver((DarkReceiver) view);\n        }\n        .....\n\n        //onSetIcon可能就是刷新icon状态的\n        @Override\n        public void onSetIcon(int viewIndex, StatusBarIcon icon) {\n            super.onSetIcon(viewIndex, icon);\n            mDarkIconDispatcher.applyDark((DarkReceiver) mGroup.getChildAt(viewIndex));\n        }\n        .....\n\n    }\n②IconManager\npublic static class IconManager implements DemoMode {\n    .....\n    protected void onIconAdded(int index, String slot, boolean blocked,\n        StatusBarIconHolder holder) {\n        \n        addHolder(index, slot, blocked, holder);\n    }    \n    \n    protected StatusIconDisplayable addHolder(int index, String slot, boolean blocked,\n        StatusBarIconHolder holder) {\n        switch (holder.getType()) {\n            case TYPE_ICON:\n                return addIcon(index, slot, blocked, holder.getIcon());\n    \n            case TYPE_WIFI:\n                return addSignalIcon(index, slot, holder.getWifiState());\n    \n            case TYPE_MOBILE:\n                return addMobileIcon(index, slot, holder.getMobileState());\n        }\n        return null;\n    }\n    \n    @VisibleForTesting\n    protected StatusBarIconView addIcon(int index, String slot, boolean blocked,\n            StatusBarIcon icon) {\n        \n            StatusBarIconView view = onCreateStatusBarIconView(slot, blocked);\n            view.set(icon);\n            mGroup.addView(view, index, onCreateLayoutParams());\n            return view;\n    }\n        .....\n}<\/code><\/pre>\n\n\n\n<p>6、StatusBarIconControllerImpl<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>//继承StatusBarIconList\npublic class StatusBarIconControllerImpl extends StatusBarIconList implements Tunable,\n        ConfigurationListener, Dumpable, CommandQueue.Callbacks, StatusBarIconController {   \n    ......        \n    @Inject\n    public StatusBarIconControllerImpl(Context context, CommandQueue commandQueue) {\n        //config_statusBarIcons\n        super(context.getResources().getStringArray(\n                com.android.internal.R.array.config_statusBarIcons));\n        Dependency.get(ConfigurationController.class).addCallback(this);\n     .....\n    }\n}<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">7、StatusBarIconList<\/h3>\n\n\n\n<p>在初始化的时候就已经定义好了所有的slots，然后从framework中加载出来，index就是string-array中的顺序。<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>public class StatusBarIconList {\n    private ArrayList&lt;Slot> mSlots = new ArrayList&lt;>();\n\n    public StatusBarIconList(String&#91;] slots) {\n        final int N = slots.length;\n        for (int i=0; i &lt; N; i++) {\n            mSlots.add(new Slot(slots&#91;i], null));\n        }\n    }<\/code><\/pre>\n\n\n\n<p>8、config_statusBarIcons<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;string-array name=\"config_statusBarIcons\">\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_rotate&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_headset&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_data_saver&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_managed_profile&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_ime&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_sync_failing&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_sync_active&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_cast&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_hotspot&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_location&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_bluetooth&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_nfc&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_tty&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_speakerphone&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_zen&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_mute&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_volume&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_vpn&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_ethernet&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_wifi&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_mobile&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_airplane&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_cdma_eri&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_data_connection&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_phone_evdo_signal&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_phone_signal&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_battery&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_alarm_clock&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_secure&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_clock&lt;/xliff:g>&lt;/item>\n    &lt;/string-array>\n \n    &lt;string translatable=\"false\" name=\"status_bar_rotate\">rotate&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_headset\">headset&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_data_saver\">data_saver&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_managed_profile\">managed_profile&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_ime\">ime&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_sync_failing\">sync_failing&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_sync_active\">sync_active&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_cast\">cast&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_hotspot\">hotspot&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_location\">location&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_bluetooth\">bluetooth&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_nfc\">nfc&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_tty\">tty&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_speakerphone\">speakerphone&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_zen\">zen&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_mute\">mute&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_volume\">volume&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_wifi\">wifi&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_cdma_eri\">cdma_eri&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_data_connection\">data_connection&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_phone_evdo_signal\">phone_evdo_signal&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_phone_signal\">phone_signal&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_battery\">battery&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_alarm_clock\">alarm_clock&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_secure\">secure&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_clock\">clock&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_mobile\">mobile&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_vpn\">vpn&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_ethernet\">ethernet&lt;/string>\n    &lt;string translatable=\"false\" name=\"status_bar_airplane\">airplane&lt;/string><\/code><\/pre>\n"</script>
<script type="application/json" id="sourceEn">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/04/17/android-systemui-%e5%90%af%e5%8a%a8%e6%b5%81%e7%a8%8b/)\n\n<h3 class=\"wp-block-heading\">SystemServer中启动<\/h3>\n\n\n\n<p>SystemServer启动后，会在Main Thread启动ActivityManagerService，当ActivityManagerService systemReady后，会去启动SystemUIService。<\/p>\n\n\n\n<p><em>/frameworks/base/services/java/com/android/server/SystemServer.java<\/em><\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①main\n    /**\n     * The main entry point from zygote.\n     */\n    public static void main(String&#91;] args) {\n        new SystemServer().run();\n    }\n②run\n    private void run() {\n        t.traceBegin(\"InitBeforeStartServices\");\n        ....\n       // Create the system service manager.\n            mSystemServiceManager = new SystemServiceManager(mSystemContext);\n            mSystemServiceManager.setStartInfo(mRuntimeRestart,\n                    mRuntimeStartElapsedTime, mRuntimeStartUptime);\n            LocalServices.addService(SystemServiceManager.class, mSystemServiceManager);\n        ....\n       }\n③mActivityManagerService.systemReady\nmActivityManagerService.systemReady(() -&gt; {\n    //准备好服务\n    Slog.i(TAG, \"Making services ready\");\n    ....\n            //跟踪开启系统界面\n            t.traceBegin(\"StartSystemUI\");\n            try {\n                //开启系统界面\n                startSystemUi(context, windowManagerF);\n            } catch (Throwable e) {\n                reportWtf(\"starting System UI\", e);\n            }\n            t.traceEnd();\n    ....\n}\n④startSystemUi\n    private static void startSystemUi(Context context, WindowManagerService windowManager) {\n        PackageManagerInternal pm = LocalServices.getService(PackageManagerInternal.class);\n        Intent intent = new Intent();\n        intent.setComponent(pm.getSystemUiServiceComponent());\n        intent.addFlags(Intent.FLAG_DEBUG_TRIAGED_MISSING);\n        //Slog.d(TAG, \"Starting service: \" + intent);\n        //通过startServiceAsUser，SystemUIService就启动了，即SystemUI进程开机启动\n        context.startServiceAsUser(intent, UserHandle.SYSTEM);\n        windowManager.onSystemUiStarted();\n    }<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">SystemUIService<\/h3>\n\n\n\n<p>在SystemUIService的onCreate方法中会调用SystemUIApplication的<strong>startServicesIfNeeded<\/strong>方法，这个方法会调用&nbsp;<strong>startServicesIfNeeded<\/strong>(SERVICES)方法启动一系列服务.<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>@Override\n    public void onCreate() {\n        super.onCreate();\n        // Start all of SystemUI\n        ((SystemUIApplication) getApplication()).startServicesIfNeeded();\n  }<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">SystemUIApplication<\/h3>\n\n\n\n<p><em>/frameworks/base/packages/SystemUI/src/com/android/systemui/SystemUIApplication.java<\/em><\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①startServicesIfNeeded()\npublic void startServicesIfNeeded() {\n    //获取所有的服务的路径，所有SERVICES统一继承了SystemUI类：\n    String&#91;] names = SystemUIFactory.getInstance().getSystemUIServiceComponents(getResources());\n    startServicesIfNeeded(/* metricsPrefix= */ \"StartServices\", names);\n}\n②startServicesIfNeeded(String metricsPrefix, String&#91;] services)\n在重载方法中将每一个名称通过反射来得到实例对象,然后依次调用每一个SystemUI的子类的start方法启动每一个模块。\n\nprivate void startServicesIfNeeded(String metricsPrefix, String&#91;] services) {\n    if (mServicesStarted) {\n        return;\n    }\n    mServices = new SystemUI&#91;services.length];\n\n    //检查一下，也许在我们开始之前很久它就已经完成了\n    if (!mBootCompleteCache.isBootComplete()) {\n        // check to see if maybe it was already completed long before we began\n        // see ActivityManagerService.finishBooting()\n        if (\"1\".equals(SystemProperties.get(\"sys.boot_completed\"))) {\n            mBootCompleteCache.setBootComplete();\n            if (DEBUG) {\n                Log.v(TAG, \"BOOT_COMPLETED was already sent\");\n            }\n        }\n    }\n\n    final DumpManager dumpManager = mRootComponent.createDumpManager();\n\n    Log.v(TAG, \"Starting SystemUI services for user \" +\n            Process.myUserHandle().getIdentifier() + \".\");\n    TimingsTraceLog log = new TimingsTraceLog(\"SystemUIBootTiming\",\n            Trace.TRACE_TAG_APP);\n    //开始追踪\n    log.traceBegin(metricsPrefix);\n    final int N = services.length;\n    //遍历services这个数组\n    for (int i = 0; i &lt; N; i++) {\n        String clsName = services&#91;i];\n        if (DEBUG) Log.d(TAG, \"loading: \" + clsName);\n        log.traceBegin(metricsPrefix + clsName);\n        long ti = System.currentTimeMillis();\n        try {\n            SystemUI obj = mComponentHelper.resolveSystemUI(clsName);\n            if (obj == null) {\n                Constructor constructor = Class.forName(clsName).getConstructor(Context.class);\n                obj = (SystemUI) constructor.newInstance(this);\n            }\n            mServices&#91;i] = obj;\n        } catch (ClassNotFoundException\n                | NoSuchMethodException\n                | IllegalAccessException\n                | InstantiationException\n                | InvocationTargetException ex) {\n            throw new RuntimeException(ex);\n        }\n\n        if (DEBUG) Log.d(TAG, \"running: \" + mServices&#91;i]);\n        //依次调用service的start方法启动服务\n        mServices&#91;i].start();\n        log.traceEnd();\n\n        // Warn if initialization of component takes too long\n        //如果组件初始化时间过长，则发出警告\n        ti = System.currentTimeMillis() - ti;\n        if (ti &gt; 1000) {\n            Log.w(TAG, \"Initialization of \" + clsName + \" took \" + ti + \" ms\");\n        }\n        if (mBootCompleteCache.isBootComplete()) {\n            mServices&#91;i].onBootCompleted();\n        }\n\n        dumpManager.registerDumpable(mServices&#91;i].getClass().getName(), mServices&#91;i]);\n    }\n    mRootComponent.getInitController().executePostInitTasks();\n    //结束追踪\n    log.traceEnd();\n\n    mServicesStarted = true;\n}<\/code><\/pre>\n\n\n\n<h2 class=\"wp-block-heading\">状态栏<\/h2>\n\n\n\n<h3 class=\"wp-block-heading\">StatusBar.start()<\/h3>\n\n\n\n<pre class=\"wp-block-code\"><code>①createAndAddWindows\n    public void createAndAddWindows(@Nullable RegisterStatusBarResult result) {\n        //创建状态栏\n        makeStatusBarView(result);\n        mNotificationShadeWindowController.attach();\n        //创建状态栏的窗口\n        mStatusBarWindowController.attach();\n    }\n②makeStatusBarView\nprotected void makeStatusBarView(@Nullable RegisterStatusBarResult result) {\n    final Context context = mContext;\n    .....\n    FragmentHostManager.get(mPhoneStatusBarWindow)\n            .addTagListener(CollapsedStatusBarFragment.TAG, (tag, fragment) -&gt; {\n                //CollapsedStatusBarFragment 替换 status_bar_container(状态栏通知显示区域)\n                CollapsedStatusBarFragment statusBarFragment =\n                        (CollapsedStatusBarFragment) fragment;\n\n                PhoneStatusBarView oldStatusBarView = mStatusBarView;\n                mStatusBarView = (PhoneStatusBarView) statusBarFragment.getView();\n                //传递statusBar处理下拉事件\n                mStatusBarView.setBar(this);\n                //传递 NotificationPanelView 显示下拉UI控制\n                mStatusBarView.setPanel(mNotificationPanelViewController);\n                mStatusBarView.setScrimController(mScrimController);\n                //初始化通知栏区域\n                statusBarFragment.initNotificationIconArea(mNotificationIconAreaController);\n                ......\n                    \n            }).getFragmentManager()\n            .beginTransaction()\n            .replace(R.id.status_bar_container, new CollapsedStatusBarFragment(),\n                    CollapsedStatusBarFragment.TAG)\n            .commit();\n    .....<\/code><\/pre>\n\n\n\n<p>CollapsedStatusBarFragment<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①createAndAddWindows\n    public void createAndAddWindows(@Nullable RegisterStatusBarResult result) {\n        //创建状态栏\n        makeStatusBarView(result);\n        mNotificationShadeWindowController.attach();\n        //创建状态栏的窗口\n        mStatusBarWindowController.attach();\n    }\n②makeStatusBarView\nprotected void makeStatusBarView(@Nullable RegisterStatusBarResult result) {\n    final Context context = mContext;\n    .....\n    FragmentHostManager.get(mPhoneStatusBarWindow)\n            .addTagListener(CollapsedStatusBarFragment.TAG, (tag, fragment) -> {\n                //CollapsedStatusBarFragment 替换 status_bar_container(状态栏通知显示区域)\n                CollapsedStatusBarFragment statusBarFragment =\n                        (CollapsedStatusBarFragment) fragment;\n\n                PhoneStatusBarView oldStatusBarView = mStatusBarView;\n                mStatusBarView = (PhoneStatusBarView) statusBarFragment.getView();\n                //传递statusBar处理下拉事件\n                mStatusBarView.setBar(this);\n                //传递 NotificationPanelView 显示下拉UI控制\n                mStatusBarView.setPanel(mNotificationPanelViewController);\n                mStatusBarView.setScrimController(mScrimController);\n                //初始化通知栏区域\n                statusBarFragment.initNotificationIconArea(mNotificationIconAreaController);\n                ......\n                    \n            }).getFragmentManager()\n            .beginTransaction()\n            .replace(R.id.status_bar_container, new CollapsedStatusBarFragment(),\n                    CollapsedStatusBarFragment.TAG)\n            .commit();\n    .....\n2、CollapsedStatusBarFragment\n①onCreateView\n    @Override\n    public View onCreateView(LayoutInflater inflater, @Nullable ViewGroup container,\n            Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.status_bar, container, false);\n    }\n②initNotificationIconArea\npublic void initNotificationIconArea(NotificationIconAreaController\n        notificationIconAreaController) {\n    //notification_icon_area是在status_bar.xml的布局，它是属于通知Notification    \n    //获取到 notification_icon_area，FrameLayout转为ViewGroup，\n    ViewGroup notificationIconArea = mStatusBar.findViewById(R.id.notification_icon_area);\n    //调用 notificationIconAreaController 获取通知要显示的view(LinearLayout)\n    //在4中跟进\n    mNotificationIconAreaInner =\n            notificationIconAreaController.getNotificationInnerAreaView();\n    //如果已经有显示的view，通过 view 父布局将其自身remove，然后再重新addView。\n    //最后将 mNotificationIconAreaInner 显示出来(设置透明度为1，visibility为VISIBLE)\n    if (mNotificationIconAreaInner.getParent() != null) {\n        ((ViewGroup) mNotificationIconAreaInner.getParent())\n                .removeView(mNotificationIconAreaInner);\n    }\n    notificationIconArea.addView(mNotificationIconAreaInner);\n\n    //与上面一样\n    ViewGroup statusBarCenteredIconArea = mStatusBar.findViewById(R.id.centered_icon_area);\n    mCenteredIconArea = notificationIconAreaController.getCenteredNotificationAreaView();\n    if (mCenteredIconArea.getParent() != null) {\n        ((ViewGroup) mCenteredIconArea.getParent())\n                .removeView(mCenteredIconArea);\n    }\n    statusBarCenteredIconArea.addView(mCenteredIconArea);\n\n    //默认为显示，直到我们知道其他情况\n    // Default to showing until we know otherwise.\n    showNotificationIconArea(false);\n}\n③showNotificationIconArea\n当状态栏下拉时，状态栏中的图标icon会慢慢的变成透明和不可见，就是通过hideSystemIconArea(true), hideNotificationIconArea(true）\n\n//当状态栏下拉时，设置状态栏中的图标icon会慢慢的变成透明和不可见    \npublic void hideNotificationIconArea(boolean animate) {\n        animateHide(mNotificationIconAreaInner, animate);\n        animateHide(mCenteredIconArea, animate);\n    }\n//设置状态栏图标透明度为1，visibility为VISIBLE\n    public void showNotificationIconArea(boolean animate) {\n        animateShow(mNotificationIconAreaInner, animate);\n        animateShow(mCenteredIconArea, animate);\n    }\n\n    public void hideOperatorName(boolean animate) {\n        if (mOperatorNameFrame != null) {\n            animateHide(mOperatorNameFrame, animate);\n        }\n    }\n\n    public void showOperatorName(boolean animate) {\n        if (mOperatorNameFrame != null) {\n            animateShow(mOperatorNameFrame, animate);\n        }\n④animateShow\n    private void animateShow(View v, boolean animate) {\n        v.animate().cancel();\n        //(设置透明度为1，visibility为VISIBLE)\n        v.setVisibility(View.VISIBLE);\n        if (!animate) {\n            v.setAlpha(1f);\n            return;\n        }\n        .....\n    }\n⑤animateHiddenState\n//将视图动画化为 INVISIBLE 或 GONE    \nprivate void animateHiddenState(final View v, int state, boolean animate) {\n        v.animate().cancel();\n        if (!animate) {\n            v.setAlpha(0f);\n            v.setVisibility(state);\n            return;\n        }\n\n        v.animate()\n                .alpha(0f)\n                .setDuration(160)\n                .setStartDelay(0)\n                .setInterpolator(Interpolators.ALPHA_OUT)\n                .withEndAction(() -> v.setVisibility(state));\n    }<\/code><\/pre>\n\n\n\n<p>status_bar.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;?xml version=\"1.0\" encoding=\"utf-8\"?>\n&lt;!--\n**\n** Copyright 2006, The Android Open Source Project\n**\n** Licensed under the Apache License, Version 2.0 (the \"License\");\n** you may not use this file except in compliance with the License.\n** You may obtain a copy of the License at\n**\n**     http://www.apache.org/licenses/LICENSE-2.0\n**\n** Unless required by applicable law or agreed to in writing, software\n** distributed under the License is distributed on an \"AS IS\" BASIS,\n** WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n** See the License for the specific language governing permissions and\n** limitations under the License.\n*/\n-->\n\n&lt;!--    android:background=\"@drawable/status_bar_closed_default_background\" -->\n&lt;com.android.systemui.statusbar.phone.PhoneStatusBarView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:systemui=\"http://schemas.android.com/apk/res/com.android.systemui\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"@dimen/status_bar_height\"\n    android:id=\"@+id/status_bar\"\n    android:orientation=\"vertical\"\n    android:focusable=\"false\"\n    android:descendantFocusability=\"afterDescendants\"\n    android:accessibilityPaneTitle=\"@string/status_bar\"\n    >\n\n    &lt;!-- add for KGDAANWIKFRA-135 -->\n    &lt;View\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"@dimen/status_bar_height\"\n        android:id=\"@+id/status_bar_dark_view\"\n        android:background=\"#ff000000\"\n        android:visibility=\"gone\" />\n    //&lt;!--通知灯，默认gone-->\n    &lt;ImageView\n        android:id=\"@+id/notification_lights_out\"\n        android:layout_width=\"@dimen/status_bar_icon_size\"\n        android:layout_height=\"match_parent\"\n        android:paddingStart=\"@dimen/status_bar_padding_start\"\n        android:paddingBottom=\"2dip\"\n        android:src=\"@drawable/ic_sysbar_lights_out_dot_small\"\n        android:scaleType=\"center\"\n        android:visibility=\"gone\"\n        />\n    //&lt;!--状态栏内容-->\n    &lt;LinearLayout android:id=\"@+id/status_bar_contents\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\n        android:paddingStart=\"@dimen/status_bar_padding_start\"\n        android:paddingEnd=\"@dimen/status_bar_padding_end\"\n        android:paddingTop=\"@dimen/status_bar_padding_top\"\n        android:orientation=\"horizontal\"\n        >\n        &lt;FrameLayout\n            android:layout_height=\"match_parent\"\n            android:layout_width=\"0dp\"\n            android:layout_weight=\"1\">\n\n            &lt;include layout=\"@layout/heads_up_status_bar_layout\" />\n\n            &lt;!-- The alpha of the left side is controlled by PhoneStatusBarTransitions, and the\n             individual views are controlled by StatusBarManager disable flags DISABLE_CLOCK and\n             DISABLE_NOTIFICATION_ICONS, respectively -->\n            &lt;LinearLayout\n                android:id=\"@+id/status_bar_left_side\"\n                android:layout_height=\"match_parent\"\n                android:layout_width=\"match_parent\"\n                android:clipChildren=\"false\"\n            >\n                &lt;ViewStub\n                    android:id=\"@+id/operator_name\"\n                    android:layout_width=\"wrap_content\"\n                    android:layout_height=\"match_parent\"\n                    android:layout=\"@layout/operator_name\" />\n\n                &lt;com.android.systemui.statusbar.policy.Clock\n                    android:id=\"@+id/clock\"\n                    android:layout_width=\"wrap_content\"\n                    android:layout_height=\"match_parent\"\n                    android:textAppearance=\"@style/TextAppearance.StatusBar.Clock\"\n                    android:singleLine=\"true\"\n                    android:paddingStart=\"@dimen/status_bar_left_clock_starting_padding\"\n                    android:paddingEnd=\"@dimen/status_bar_left_clock_end_padding\"\n                    android:gravity=\"center_vertical|start\"\n                />\n\n                //&lt;!--通知图标区域-->\n                &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n                    android:id=\"@+id/notification_icon_area\"\n                    android:layout_width=\"0dp\"\n                    android:layout_height=\"match_parent\"\n                    android:layout_weight=\"1\"\n                    android:orientation=\"horizontal\"\n                    android:clipChildren=\"false\"/>\n\n            &lt;/LinearLayout>\n        &lt;/FrameLayout>\n\n        &lt;!-- Space should cover the notch (if it exists) and let other views lay out around it -->\n        &lt;android.widget.Space\n            android:id=\"@+id/cutout_space_view\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:gravity=\"center_horizontal|center_vertical\"\n        />\n\n        //居中的图标区域        \n        &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n            android:id=\"@+id/centered_icon_area\"\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"match_parent\"\n            android:orientation=\"horizontal\"\n            android:clipChildren=\"false\"\n            android:gravity=\"center_horizontal|center_vertical\"/>\n\n        &lt;com.android.keyguard.AlphaOptimizedLinearLayout android:id=\"@+id/system_icon_area\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:layout_weight=\"1\"\n            android:orientation=\"horizontal\"\n            android:gravity=\"center_vertical|end\"\n            >\n            //&lt;!--系统图标-->\n            &lt;include layout=\"@layout/system_icons\" />\n        &lt;/com.android.keyguard.AlphaOptimizedLinearLayout>\n    &lt;/LinearLayout>\n    //&lt;!--紧急密码管理员文本-->\n    &lt;ViewStub\n        android:id=\"@+id/emergency_cryptkeeper_text\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"match_parent\"\n        android:layout=\"@layout/emergency_cryptkeeper_text\"\n    />\n&lt;/com.android.systemui.statusbar.phone.PhoneStatusBarView><\/code><\/pre>\n\n\n\n<p>NotificationIconAreaController<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>getNotificationInnerAreaView\n    /**\n     * Returns the view that represents the notification area.+\n     * 返回表示通知区域的视图。\n     */\n    public View getNotificationInnerAreaView() {\n        return mNotificationIconArea;\n    }\ninitializeNotificationAreaViews\n/**\n * Initializes the views that will represent the notification area.\n * 初始化将表示通知区域的视图。\n */\nprotected void initializeNotificationAreaViews(Context context) {\n    reloadDimens(context);\n    \n    LayoutInflater layoutInflater = LayoutInflater.from(context);\n    //通知图标区域布局\n    mNotificationIconArea = inflateIconArea(layoutInflater);\n    //通知图标\n    mNotificationIcons = mNotificationIconArea.findViewById(R.id.notificationIcons);\n    //获取通知滚动布局\n    mNotificationScrollLayout = mStatusBar.getNotificationScrollLayout();\n    //中心图标区域布局\n    mCenteredIconArea = layoutInflater.inflate(R.layout.center_icon_area, null);\n    //居中的图标\n    mCenteredIcon = mCenteredIconArea.findViewById(R.id.centeredIcon);\n\n    initAodIcons();\n}\ninflateIconArea\n\n    protected View inflateIconArea(LayoutInflater inflater) {\n        return inflater.inflate(R.layout.notification_icon_area, null);\n    }<\/code><\/pre>\n\n\n\n<p>status icon加载流程<\/p>\n\n\n\n<p>1、 status_bar.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> &lt;com.android.systemui.statusbar.AlphaOptimizedFrameLayout\n            android:id=\"@+id/centered_icon_area\"\n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"match_parent\"\n            android:orientation=\"horizontal\"\n            android:clipChildren=\"false\"\n            android:gravity=\"center_horizontal|center_vertical\"/>\n\n        &lt;com.android.keyguard.AlphaOptimizedLinearLayout android:id=\"@+id/system_icon_area\"\n            android:layout_width=\"0dp\"\n            android:layout_height=\"match_parent\"\n            android:layout_weight=\"1\"\n            android:orientation=\"horizontal\"\n            android:gravity=\"center_vertical|end\"\n            >\n            &lt;!--系统图标-->\n            &lt;include layout=\"@layout/system_icons\" />\n        &lt;/com.android.keyguard.AlphaOptimizedLinearLayout><\/code><\/pre>\n\n\n\n<p>2、system_icons.xml<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n              xmlns:systemui=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/system_icons\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\n    android:gravity=\"center_vertical\">\n    //StatusIconContainer继承AlphaOptimizedLinearLayout\n    &lt;com.android.systemui.statusbar.phone.StatusIconContainer android:id=\"@+id/statusIcons\"\n        android:layout_width=\"0dp\"\n        android:layout_weight=\"1\"\n        android:layout_height=\"match_parent\"\n        android:paddingEnd=\"@dimen/signal_cluster_battery_padding\"\n        android:gravity=\"center_vertical\"\n        android:orientation=\"horizontal\"/>\n\n    &lt;com.android.systemui.BatteryMeterView android:id=\"@+id/battery\"\n        android:layout_height=\"match_parent\"\n        android:layout_width=\"wrap_content\"\n        android:clipToPadding=\"false\"\n        android:clipChildren=\"false\"\n        systemui:textAppearance=\"@style/TextAppearance.StatusBar.Clock\" />\n&lt;/LinearLayout><\/code><\/pre>\n\n\n\n<p>3、AlphaOptimizedLinearLayout<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> //该方法用来标记当前view是否存在过度绘制，存在返回ture，不存在返回false，\n    //api里面默认返回为true，status icon不存在过度绘制。\n    @Override\n    public boolean hasOverlappingRendering() {\n        return false;\n    }<\/code><\/pre>\n\n\n\n<p>4、CollapsedStatusBarFragment<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code> @Override\n    public void onViewCreated(View view, @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n        mStatusBar = (PhoneStatusBarView) view;\n        if (savedInstanceState != null &amp;&amp; savedInstanceState.containsKey(EXTRA_PANEL_STATE)) {\n            mStatusBar.restoreHierarchyState(\n                    savedInstanceState.getSparseParcelableArray(EXTRA_PANEL_STATE));\n        }\n......\n    }<\/code><\/pre>\n\n\n\n<p>5、StatusBarIconController<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>①DarkIconManager\n    /**\n     * Version of ViewGroup that observes state from the DarkIconDispatcher.\n     */\n    public static class DarkIconManager extends IconManager {\n        private final DarkIconDispatcher mDarkIconDispatcher;\n        private int mIconHPadding;\n\n        public DarkIconManager(LinearLayout linearLayout, CommandQueue commandQueue) {\n            super(linearLayout, commandQueue);\n            mIconHPadding = mContext.getResources().getDimensionPixelSize(\n                    R.dimen.status_bar_icon_padding);\n            mDarkIconDispatcher = Dependency.get(DarkIconDispatcher.class);\n        }\n        //每个icon应该就是对应着代表顺序的index和数据类型为String的slot\n        @Override\n        protected void onIconAdded(int index, String slot, boolean blocked,\n                StatusBarIconHolder holder) {\n            StatusIconDisplayable view = addHolder(index, slot, blocked, holder);\n            mDarkIconDispatcher.addDarkReceiver((DarkReceiver) view);\n        }\n        .....\n\n        //onSetIcon可能就是刷新icon状态的\n        @Override\n        public void onSetIcon(int viewIndex, StatusBarIcon icon) {\n            super.onSetIcon(viewIndex, icon);\n            mDarkIconDispatcher.applyDark((DarkReceiver) mGroup.getChildAt(viewIndex));\n        }\n        .....\n\n    }\n②IconManager\npublic static class IconManager implements DemoMode {\n    .....\n    protected void onIconAdded(int index, String slot, boolean blocked,\n        StatusBarIconHolder holder) {\n        \n        addHolder(index, slot, blocked, holder);\n    }    \n    \n    protected StatusIconDisplayable addHolder(int index, String slot, boolean blocked,\n        StatusBarIconHolder holder) {\n        switch (holder.getType()) {\n            case TYPE_ICON:\n                return addIcon(index, slot, blocked, holder.getIcon());\n    \n            case TYPE_WIFI:\n                return addSignalIcon(index, slot, holder.getWifiState());\n    \n            case TYPE_MOBILE:\n                return addMobileIcon(index, slot, holder.getMobileState());\n        }\n        return null;\n    }\n    \n    @VisibleForTesting\n    protected StatusBarIconView addIcon(int index, String slot, boolean blocked,\n            StatusBarIcon icon) {\n        \n            StatusBarIconView view = onCreateStatusBarIconView(slot, blocked);\n            view.set(icon);\n            mGroup.addView(view, index, onCreateLayoutParams());\n            return view;\n    }\n        .....\n}<\/code><\/pre>\n\n\n\n<p>6、StatusBarIconControllerImpl<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>//继承StatusBarIconList\npublic class StatusBarIconControllerImpl extends StatusBarIconList implements Tunable,\n        ConfigurationListener, Dumpable, CommandQueue.Callbacks, StatusBarIconController {   \n    ......        \n    @Inject\n    public StatusBarIconControllerImpl(Context context, CommandQueue commandQueue) {\n        //config_statusBarIcons\n        super(context.getResources().getStringArray(\n                com.android.internal.R.array.config_statusBarIcons));\n        Dependency.get(ConfigurationController.class).addCallback(this);\n     .....\n    }\n}<\/code><\/pre>\n\n\n\n<h3 class=\"wp-block-heading\">7、StatusBarIconList<\/h3>\n\n\n\n<p>在初始化的时候就已经定义好了所有的slots，然后从framework中加载出来，index就是string-array中的顺序。<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>public class StatusBarIconList {\n    private ArrayList&lt;Slot> mSlots = new ArrayList&lt;>();\n\n    public StatusBarIconList(String&#91;] slots) {\n        final int N = slots.length;\n        for (int i=0; i &lt; N; i++) {\n            mSlots.add(new Slot(slots&#91;i], null));\n        }\n    }<\/code><\/pre>\n\n\n\n<p>8、config_statusBarIcons<\/p>\n\n\n\n<pre class=\"wp-block-code\"><code>&lt;string-array name=\"config_statusBarIcons\">\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_rotate&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_headset&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_data_saver&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_managed_profile&lt;/xliff:g>&lt;/item>\n        &lt;item>&lt;xliff:g id=\"id\">@string/status_bar_ime     document.getElementById("langToggle").textContent=lang==="en"?"中文":"EN";
    if(window.setArticleLanguage) window.setArticleLanguage(lang);
    localStorage.setItem("snowcrane-lang",lang);
  }
  document.getElementById("langToggle").onclick=function(){

  };

})();
