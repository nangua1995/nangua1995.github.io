<h1 data-zh="从豆包&amp;吉利 联合比赛 看大模型吹响落地冲锋号" data-en="从豆包&amp;吉利 联合比赛 看大模型吹响落地冲锋号">从豆包&amp;吉利 联合比赛 看大模型吹响落地冲锋号</h1>
<p class="summary" data-zh="特别是在当前的汽车行业，大模型正以前所未有的速度加快融入，成为推动产业升级的重要引擎。如何发挥好大模型的真正价 […]" data-en="特别是在当前的汽车行业，大模型正以前所未有的速度加快融入，成为推动产业升级的重要引擎。如何发挥好大模型的真正价 […]">特别是在当前的汽车行业，大模型正以前所未有的速度加快融入，成为推动产业升级的重要引擎。如何发挥好大模型的真正价 […]</p>
<p class="tags" data-zh="#行业前沿" data-en="#行业前沿">#行业前沿</p>
<div id="content" class="markdown"></div>
<script type="application/json" id="sourceZh">"> 原文发布于主站：[查看原文](https://zhinengzuocang.cn/2024/10/22/%e8%bd%a6%e8%bd%bd%e5%a4%a7%e6%a8%a1%e5%9e%8b%e7%8e%b0%e7%8a%b6/)\n\n<p>特别是在当前的汽车行业，大模型正以前所未有的速度加快融入，成为推动产业升级的重要引擎。如何发挥好大模型的真正价值，是整个汽车行业面临的挑战。大模型上车的能力需要进一步被开发，汽车行业需要更好性能、更易落地的大模型产品，推动大模型从尝鲜期走向落地期。<\/p>\n\n\n\n<p>例如当前，以<strong>豆包大模型<\/strong>为代表的模型产品正在快速打开市场，今年5月，字节跳动自主研发的豆包大模型通过火山引擎正式对外提供服务。<\/p>\n\n\n\n<p>大赛官网：https://www.volcengine.com/event/ai-competition<\/p>\n\n\n\n<p>当前，多家车企都把大模型上车作为重要卖点，但大模型上车速度和效果还有待提升。例如，智能座舱是大多车企接入大模型最容易的落脚点之一，但目前，大模型主要的功能点集中在<strong>语音交互、娱乐功能、知识库<\/strong>等模块，在<strong>情绪感知、智能助手、情感对话、多模态交互<\/strong>等方面还有更多进步空间。此外，部分大模型产品单一的交互内容，薄弱的语义理解能力，以及娱乐推荐对个性化的轻视，也降低了用户的使用体验。对此，当前业内逐渐形成的共识是，未来大模型将重塑座舱，智能座舱会向智能体方向发展，能够理解场景信息，很自然地了解用户需求，生成场景化的解决方案并完成执行。火山引擎汽车行业总经理杨立伟进一步指出：未来大模型助力座舱的理想状态是，可以以更低的成本，更快的速度，“<strong>一步到位<\/strong>”满足用户的个性化需求，让用户更“<strong>懒<\/strong>”地去享受用车。<\/p>\n\n\n\n<p>但现在大多数大模型产品在这些座舱功能的实现上还处于起步阶段。除了座舱对大模型提出更多要求外，在生产制造、研发设计、营销售后等环节，也对大模型存在更加广泛而深刻的需求。<\/p>\n\n\n\n<p>比赛赛道和获奖作品：<\/p>\n\n\n\n<figure class=\"wp-block-image size-large\"><img decoding=\"async\" loading=\"lazy\" width=\"1024\" height=\"589\" src=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-1024x589.png\" alt=\"\" class=\"wp-image-784\" srcset=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-1024x589.png 1024w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-300x172.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-768x441.png 768w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-1536x883.png 1536w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-36-2048x1177.png 2048w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /><\/figure>\n\n\n\n<p>火山引擎架构图<\/p>\n\n\n\n<figure class=\"wp-block-image size-full\"><img decoding=\"async\" loading=\"lazy\" width=\"1000\" height=\"563\" src=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-37.png\" alt=\"\" class=\"wp-image-785\" srcset=\"https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-37.png 1000w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-37-300x169.png 300w, https://zhinengzuocang.cn/wp-content/uploads/2024/10/image-37-768x432.png 768w\" sizes=\"(max-width: 1000px) 100vw, 1000px\" /><\/figure>\n\n\n\n<p>总的来说目前处于垂直领域和智能体结合的初级阶段，还需要大量的磨合和行业能力交融才能诞生出各个领域真正好用的ai模型。目前大模型还没有充分发挥其自身相对于传统软件或者神经网络来说独特的能力。<\/p>\n"</script>
