name: Sync server blog

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports a five-minute minimum interval.  This keeps the
    # Pages mirror close to the publishing time without storing a GitHub key
    # on the production server.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror published articles
        run: |
          python3 scripts/sync_server_blog.py
          python3 scripts/sync_wordpress.py
          python3 scripts/build_blog_features.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog wordpress article timeline search-index.json archive-index.json index.html
          git diff --cached --quiet || git commit -m "chore: sync server blog"
          git push
